/**
 * Hand an item over.
 *
 * Every refusal below is a refusal the store keeper would otherwise have to
 * remember: the wrong grade, the second uniform, the shelf that is already
 * empty. Making the screen say no is the whole point of putting the store
 * in the portal.
 */
async function issueToStudent(itemId) {
  if (!guard('issue')) return;

  const item = stockItem(itemId);
  const student = S.students.find((s) => s.id === S.storeStudentId);
  if (!item || !student) return;

  const box = el('q-' + itemId);
  const qty = Math.floor(Number(box ? box.value : 1));

  if (!(qty > 0)) return toast('Enter a quantity of at least one.', true);

  if (!itemsForStudent(student).some((i) => i.id === itemId)) {
    return toast(item.name + ' is not issued to ' + className(student.classId) + '.', true);
  }

  const left = onHand(itemId);
  if (qty > left) {
    return toast('Only ' + left + ' left on the shelf.', true);
  }

  const cap = Number(item.perStudent || 0);
  const had = issuedToStudent(student.id, itemId);
  if (cap > 0 && had.qty + qty > cap) {
    return toast(
      student.name + ' already had ' + had.qty + ' on ' + had.last +
      '. The allowance is ' + cap + ' per year.', true
    );
  }

  const row = {
    id: uid(),
    studentId: student.id,
    itemId,
    name: item.name,          // copied, not referenced — see the panel above
    qty,
    by: PORTAL_ROLE_LABEL[S.role] || S.role,
    at: new Date().toISOString(),
  };

  if (!(await appendMovement('issues', row))) return;

  render();
  toast(qty + ' × ' + item.name + ' issued to ' + student.name + '.');
}

/**
 * Build the catalogue from the school's own bill.
 *
 * Every item here exists because the school charges for it, and it is
 * issued to exactly the levels that pay for it. That is not a shortcut —
 * it is the only definition of "what this grade is entitled to" that the
 * school has already agreed and printed.
 */
async function loadStoreCatalogue() {
  if (!S.classes.length) {
    return toast('Load the fee structure first — the store follows it.', true);
  }

  const button = el('load-store');
  if (button) { button.disabled = true; button.textContent = 'Loading…'; }

  try {
    const items = S.stockItems.slice();

    HOA_FEES.forEach((level) => {
      const klass = S.classes.find((c) => c.name === level.level);
      if (!klass) return;

      Object.entries(STORE_FROM_FEES).forEach(([feeName, spec]) => {
        // Charged in any term? Term 1 carries the one-off items.
        const price = ['1', '2', '3']
          .map((t) => level.terms[t] && level.terms[t][feeName])
          .find((v) => v !== undefined);
        if (price === undefined) return;

        const name = spec.label + ' · ' + level.level;

        const at = items.findIndex((x) => x.name === name);
        const record = {
          id: at >= 0 ? items[at].id : uid(),
          name,
          category: spec.category,
          price,
          perStudent: 1,
          reorder: 5,
          classIds: [klass.id],
          opening: at >= 0 ? Number(items[at].opening || 0) : 0,
        };

        if (at >= 0) items[at] = record; else items.push(record);
      });
    });

    if (!(await save('config/stock', { items }))) return;
    S.stockItems = items;
    render();
    toast(items.length + ' item(s) in the store catalogue.');
  } catch (error) {
    console.error(error);
    toast('Could not build the catalogue.', true);
  } finally {
    if (button) { button.disabled = false; button.textContent = 'Load the store catalogue'; }
  }
}

/* --------------------------- staff attendance ---------------------------
   One document per month, not per day: `staffattendance/2026-09` holds
   { days: { '2026-09-19': { teacherId: 'P' } } }. Twelve staff over a
   22-day month is ~264 entries, well inside a document, and it means the
   monthly summary and the Proprietress's dashboard card each cost one
   read instead of thirty-one.
   ------------------------------------------------------------------- */
const ymOf = (date) => String(date).slice(0, 7);

function paintStaffAttendance() {
  if (!S.teachers.length) {
    el('view').innerHTML =
      '<div class="head"><div><h1>Staff attendance</h1></div></div>' +
      '<div class="empty"><p>No staff on file yet. Load the staff list from Setup first.</p></div>';
    return;
  }

  if (!S.staffAttDate) S.staffAttDate = today();
  const date = S.staffAttDate;
  const ym = ymOf(date);

  const loaded = S.staffMonth && S.staffMonth.ym === ym;
  const days = loaded ? S.staffMonth.days : null;
  const marks = days ? (days[date] || {}) : null;
  const writable = canWrite('staffatt');

  const roll = S.teachers.slice().sort((a, b) =>
    (STAFF_UNITS.indexOf(a.unit) - STAFF_UNITS.indexOf(b.unit)) ||
    String(a.name).localeCompare(String(b.name)));

  const counts = { P: 0, A: 0, L: 0, V: 0 };
  if (marks) roll.forEach((t) => { if (marks[t.id]) counts[marks[t.id]]++; });
  const marked = counts.P + counts.A + counts.L + counts.V;

  // Running totals for the month, so a pattern of absence is visible.
  const monthly = {};
  roll.forEach((t) => { monthly[t.id] = { P: 0, A: 0, L: 0, V: 0, days: 0 }; });
  if (days) {
    Object.values(days).forEach((dayMarks) => {
      Object.entries(dayMarks || {}).forEach(([tid, code]) => {
        if (monthly[tid] && monthly[tid][code] !== undefined) {
          monthly[tid][code]++;
          monthly[tid].days++;
        }
      });
    });
  }

  el('view').innerHTML =
    '<div class="head"><div><h1>Staff attendance</h1>' +
    '<p>' + esc(date) + ' · kept by the principal</p></div>' +
    (writable ? '<button class="btn ghost" id="sa-all">Mark all present</button>' : '') +
    '</div>' +

    (writable ? '' :

      '<input type="date" id="sa-date" style="width:auto" value="' + esc(date) + '">' +
      (loaded ? '' : '<span class="hint">Loading register…</span>') +
    '</div>' +

    '<div class="stats">' +
      stat('Present', counts.P, 'of ' + roll.length + ' staff') +
      stat('Absent', counts.A, counts.V + ' on leave') +

      const m = monthly[t.id];
      const away = m.A + m.V;
      return '<tr><td>' + esc(t.name) +
        '<br><span class="hint">' + esc(t.role || t.unit || 'Staff') + '</span></td>' +
        '<td><div class="att">' +

          '<button data-s="' + c.code + '" title="' + c.label + '" data-sset="' + t.id + '|' + c.code + '" class="' +
          (state === c.code ? 'on' : '') + '"' + (writable ? '' : ' disabled') + '>' + c.code + '</button>').join('') +
        '</div></td>' +
        '<td class="num">' + (m.days
          ? m.P + ' present' + (away ? ' · ' + away + ' away' : '') + (m.L ? ' · ' + m.L + ' late' : '')
          : '<span class="hint">—</span>') + '</td></tr>';
    }).join('') +
    '</tbody></table></div></div>' +
    '<p class="hint" style="margin-top:10px">P present · A absent · L late · V on leave. ' +
    'Click a mark again to clear it.</p>';

  el('sa-date').addEventListener('change', (e) => {
    S.staffAttDate = e.target.value || today();
    render();
    if (!(S.staffMonth && S.staffMonth.ym === ymOf(S.staffAttDate))) loadStaffMonth();
  });

  const all = el('sa-all');
  if (all) all.addEventListener('click', async () => {
    if (!guard('staffatt')) return;
    const next = {};
    roll.forEach((t) => { next[t.id] = 'P'; });
    if (!(await saveStaffDay(date, next))) return;
    render();
    toast('All ' + roll.length + ' staff marked present.');
  });

  el('view').querySelectorAll('[data-sset]').forEach((b) => {
    b.addEventListener('click', async () => {
      if (!guard('staffatt')) return;
      const [teacherId, code] = b.dataset.sset.split('|');
      const next = Object.assign({}, marks || {});
      if (next[teacherId] === code) delete next[teacherId];
      else next[teacherId] = code;
      if (!(await saveStaffDay(date, next))) return;
      render();
    });
  });

  if (!loaded) loadStaffMonth();
}

async function loadStaffMonth() {
  const ym = ymOf(S.staffAttDate || today());
  try {
    const snap = await db.doc('staffattendance/' + ym).get();
    S.staffMonth = { ym, days: (snap.exists ? snap.data().days : {}) || {} };
  } catch (error) {
    console.error(error);
    S.staffMonth = { ym, days: {} };
    toast('Could not load the staff register.', true);
  }
  if (S.page === 'staffatt') render();
}

async function saveStaffDay(date, dayMarks) {
  const ym = ymOf(date);
  const days = Object.assign({}, (S.staffMonth && S.staffMonth.ym === ym) ? S.staffMonth.days : {});
  if (Object.keys(dayMarks).length) days[date] = dayMarks;
  else delete days[date];

  if (!(await save('staffattendance/' + ym, { days, updated: new Date().toISOString() }))) return false;
  S.staffMonth = { ym, days };
  if (ym === ymOf(today())) S.staffToday = null;  // dashboard card re-reads
  return true;
}

/* The Proprietress's dashboard card reads the same month document. */
async function loadStaffToday() {
  const ym = ymOf(today());
  try {
    const snap = await db.doc('staffattendance/' + ym).get();
    const days = (snap.exists ? snap.data().days : {}) || {};
    S.staffToday = { date: today(), marks: days[today()] || {} };
  } catch (error) {
    console.error(error);
    S.staffToday = { date: today(), marks: {} };
  }
  if (S.page === 'dashboard') render();
}

/**
 * Create the nine grade levels and every fee item for all three terms,
 * straight from the published bill. Safe to run on an empty portal; it
 * refuses if fees already exist rather than doubling them.
 */
/**
 * Load the school's staff list. Safe to run on an empty portal; it matches
 * on name so re-running updates a title rather than creating a duplicate.
 */
async function loadHoaStaff() {
  const button = el('load-staff');
  if (button) { button.disabled = true; button.textContent = 'Loading\u2026'; }

  const staff = S.teachers.slice();
  let added = 0, updated = 0;

  HOA_STAFF.forEach((person) => {
    const at = staff.findIndex((x) =>
      x.name.trim().toLowerCase() === person.name.toLowerCase());

    if (at >= 0) {
      // Keep whatever contact details have already been entered.
      staff[at] = Object.assign({}, staff[at], {
        role: person.role, unit: person.unit, portalRole: person.portalRole,
      });
      updated++;
    } else {
      staff.push(Object.assign({ id: uid(), phone: '', email: '' }, person));
      added++;
    }
  });

  try {
    if (!(await save('config/teachers', { items: staff }))) return;
    S.teachers = staff;
    render();
    toast(added + ' added, ' + updated + ' updated.');
  } finally {
    if (button) { button.disabled = false; button.textContent = 'Load the staff list'; }
  }
}

async function loadHoaFees() {
  if (S.feeItems.length) {
    return toast('Fees already exist. Clear them first, or edit by hand.', true);
  }

  const button = el('load-fees');
  if (button) { button.disabled = true; button.textContent = 'Loading…'; }

  // Reuse any class of the same name that is already set up.
  const classes = S.classes.slice();
  const findOrAdd = (name) => {
    const existing = classes.find((c) => c.name === name);
    if (existing) return existing;
    const created = { id: uid(), name };
    classes.push(created);
    return created;
  };

  const items = [];

  HOA_FEES.forEach((level) => {
    const klass = findOrAdd(level.level);

    ['1', '2', '3'].forEach((t) => {
      const termName = S.config.terms[Number(t) - 1];
      if (!termName) return;

      Object.entries(level.terms[t]).forEach(([name, amount]) => {
        items.push({
          id: uid(),
          classId: klass.id,
          term: termName,
          name,
          amount,
          newOnly: level.newOnly.includes(name),
        });
      });
    });
  });

  try {
    await save('config/classes', { items: classes });
    await save('config/fees', { items });

    S.classes = classes;
    S.feeItems = items;

    render();
    toast(items.length + ' fee items across ' + HOA_FEES.length + ' levels loaded.');
  } catch (error) {
    console.error(error);
    toast('Could not save the fee structure.', true);
  } finally {
    if (button) { button.disabled = false; button.textContent = 'Load the 2026/2027 fees'; }
  }
}

function teacherName(id) {
  return (S.teachers.find((t) => t.id === id) || {}).name || '—';

function assignmentsFor(teacherId) {
  return S.assignments.filter((a) => a.teacherId === teacherId);

/** Who teaches this class/subject pair — the row-level rule, in one place. */
function teachersOf(classId, subjectId) {
  return S.assignments
    .filter((a) => a.classId === classId && a.subjectId === subjectId)
    .map((a) => teacherName(a.teacherId));
}

/** Pairs nobody is assigned to teach — the gap that bites at marks time. */
function unassignedCount() {
  let gaps = 0;
  S.classes.forEach((c) => {
    S.subjects.forEach((sub) => {
      if (!S.assignments.some((a) => a.classId === c.id && a.subjectId === sub.id)) gaps++;
    });
  });
  return gaps;
}

        esc(t.phone || '') + '"></label>' +
      '<label class="f"><span>Email</span><input type="text" id="t-email" value="' +
        esc(t.email || '') + '"></label>' +
    '</div>' +
    '<label class="f"><span>Role or title</span><input type="text" id="t-role" value="' +
      esc(t.role || '') + '" placeholder="Head of Science Department"></label>' +
    '<div class="row2">' +
      '<label class="f"><span>Part of the school</span><select id="t-unit">' +
        STAFF_UNITS.map((u) => '<option' +
          ((t.unit || 'Teaching staff') === u ? ' selected' : '') + '>' + u + '</option>').join('') +
      '</select></label>' +
      '<label class="f"><span>Portal access</span><select id="t-portalrole">' +
        Object.entries(PORTAL_ROLE_LABEL).map(([k, label]) => '<option value="' + k + '"' +
          ((t.portalRole || 'teacher') === k ? ' selected' : '') + '>' + label + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<label class="f"><span>Class teacher of</span><select id="t-homeroom">' +
      '<option value="">Not a class teacher</option>' +
      S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.classTeacherId === t.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
    '</select></label>' +
    '<p class="hint">The class teacher takes the daily register. Subject teaching ' +
    'is assigned separately.</p>' +
    '<p class="hint">Portal access records which account this person should be ' +
    'issued once real logins exist. It grants nothing in this prototype.</p>' +
    '<div class="foot">' +
      (isNew ? '' : '<button class="btn ghost" id="t-remove" style="margin-right:auto">Remove</button>') +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn" id="t-save">' + (isNew ? 'Add teacher' : 'Save') + '</button>' +
    '</div>',
    () => {
      el('t-save').addEventListener('click', async () => {
        const name = el('t-name').value.trim();
        if (!name) return toast('A name is required.', true);

        const id = t.id || uid();
        const record = {
          id, name,
          phone: el('t-phone').value.trim(),
          email: el('t-email').value.trim(),
          role: el('t-role').value.trim(),
          unit: el('t-unit').value,
          // A note for whoever issues the real logins, not a live permission.
          portalRole: el('t-portalrole').value,
        };

        const teachers = S.teachers.slice();
        const at = teachers.findIndex((x) => x.id === id);
        if (at >= 0) teachers[at] = record; else teachers.push(record);

        // Homeroom lives on the class, not the teacher: one class has one
        // class teacher, and storing it here would let two classes disagree.
        const homeroom = el('t-homeroom').value;
        const classes = S.classes.map((c) => {
          const copy = Object.assign({}, c);
          if (copy.classTeacherId === id) delete copy.classTeacherId;
          if (copy.id === homeroom) copy.classTeacherId = id;
          return copy;
        });

        if (!(await save('config/teachers', { items: teachers }))) return;
        if (!(await save('config/classes', { items: classes }))) return;

        S.teachers = teachers;
        S.classes = classes;
        closeModal();
        render();
        toast(isNew ? name + ' added.' : 'Changes saved.');
      });

      const remove = el('t-remove');
      if (remove) remove.addEventListener('click', async () => {
        const mine = assignmentsFor(t.id);
        if (mine.length && !confirm(
          t.name + ' has ' + mine.length + ' assignment(s). Removing them ' +
          'also removes those assignments. Continue?'
        )) return;

        const teachers = S.teachers.filter((x) => x.id !== t.id);
        const assignments = S.assignments.filter((a) => a.teacherId !== t.id);
        const classes = S.classes.map((c) => {
          const copy = Object.assign({}, c);
          if (copy.classTeacherId === t.id) delete copy.classTeacherId;
          return copy;
        });

        if (!(await save('config/teachers', { items: teachers }))) return;
        await save('config/assignments', { items: assignments });
        await save('config/classes', { items: classes });

        S.teachers = teachers;
        S.assignments = assignments;
        S.classes = classes;
        closeModal();
        render();
        toast(t.name + ' removed. Marks they entered are unchanged.');
      });
    }
  );
}

          '</tbody></table></div>'

      '<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px">' +
        '<div class="row2">' +
          '<label class="f"><span>Class</span><select id="a-class">' +
            S.classes.map((c) => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') +
          '</select></label>' +
          '<label class="f"><span>Subject</span><select id="a-subject">' +
            S.subjects.map((x) => '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('') +
          '</select></label>' +
        '</div>' +
        '<button class="btn small" id="a-add">Add assignment</button>' +
      '</div>' +
      '<div class="foot"><button class="btn ghost" onclick="closeModal()">Done</button></div>',
      () => {
        el('a-add').addEventListener('click', async () => {
          const classId = el('a-class').value;
          const subjectId = el('a-subject').value;

          const clash = S.assignments.find((a) =>
            a.teacherId === teacherId && a.classId === classId && a.subjectId === subjectId);
          if (clash) return toast('Already assigned.', true);

          const items = S.assignments.concat([{ id: uid(), teacherId, classId, subjectId }]);
          if (!(await save('config/assignments', { items }))) return;
          S.assignments = items;
          draw();
          toast('Assigned.');
        });

        el('modal').querySelectorAll('[data-unassign]').forEach((b) => {
          b.addEventListener('click', async () => {
            const items = S.assignments.filter((a) => a.id !== b.dataset.unassign);
            if (!(await save('config/assignments', { items }))) return;
            S.assignments = items;
            draw();
            toast('Assignment removed.');
          });
        });
      }
    );
  };

  draw();
}

/* --------------------------- reports --------------------------- */

/**
 * Scores and attendance are stored one document per class/subject/term and
 * one per class/day, which is right for editing but useless for analytics.
 * So the reports page pulls both collections once and works in memory.
 * At school scale that is a few hundred documents; if the school ever grows
 * past a few thousand, this becomes a server-side aggregate instead.
 */
async function loadAnalytics() {
  try {
    const [scoreSnap, attSnap] = await Promise.all([
      db.collection('scores').get(),
      db.collection('attendance').get(),
    ]);

    S.analytics = {
      scores: scoreSnap.docs.map((d) => ({ id: d.id, marks: d.data().marks || {} })),
      attendance: attSnap.docs.map((d) => ({ id: d.id, states: d.data().states || {} })),
    };
  } catch (error) {
    console.error(error);
    S.analytics = { scores: [], attendance: [] };
    toast('Could not load the analytics data.', true);
  }

  if (S.page === 'reports') render();
}

/** Every mark for a student, as { subjectId, term, percent }. */
function studentMarks(studentId) {
  if (!S.analytics) return [];

  const out = [];
  S.analytics.scores.forEach((doc) => {
    const entry = doc.marks[studentId];
    if (!entry) return;

    const [classId, subjectId, termKey] = doc.id.split('_');
    const ca = Number(entry.ca ?? NaN);
    const mid = Number(entry.mid ?? NaN);
    const fin = Number(entry.final ?? NaN);
    if ([ca, mid, fin].every((v) => isNaN(v))) return;

    const weightSeen = (isNaN(ca) ? 0 : WEIGHTS.ca) + (isNaN(mid) ? 0 : WEIGHTS.mid)
      + (isNaN(fin) ? 0 : WEIGHTS.final);
    const weighted = (isNaN(ca) ? 0 : ca * WEIGHTS.ca) + (isNaN(mid) ? 0 : mid * WEIGHTS.mid)
      + (isNaN(fin) ? 0 : fin * WEIGHTS.final);

    // Scale to what has been marked, so a student with only the CA entered
    // is not shown at a third of their real standing.
    out.push({
      classId, subjectId, termKey,
      percent: weightSeen ? Math.round((weighted / weightSeen) * 10) / 10 : null,
      complete: weightSeen === 100,
    });
  });
  return out;
}

/** Attendance tally for a student: present, late, absent, excused. */
function studentAttendance(studentId) {
  const tally = { P: 0, A: 0, L: 0, E: 0 };
  if (!S.analytics) return tally;

  S.analytics.attendance.forEach((doc) => {
    const state = doc.states[studentId];
    if (state && tally[state] !== undefined) tally[state]++;
  });
  return tally;
}

function attendanceRate(tally) {
  const counted = tally.P + tally.A + tally.L;
  return counted ? Math.round(((tally.P + tally.L) / counted) * 1000) / 10 : null;
}

const REPORT_TABS = [
  { id: 'collection',  label: 'Fee collection' },
  { id: 'aging',       label: 'Arrears' },
  { id: 'attendance',  label: 'Attendance' },
  { id: 'performance', label: 'Class performance' },
  { id: 'teachers',    label: 'Teacher activity' },
];

function paintReports() {
  const term = S.config.currentTerm;

  el('view').innerHTML =
    '<div class="head"><div><h1>Reports</h1>' +
    '<p>' + esc(S.config.year) + ' · ' + esc(term) + '</p></div>' +

    '</div>' +

    '<div class="bar" id="report-tabs">' +
    REPORT_TABS.map((t) => '<button class="btn ' +

      t.label + '</button>').join('') +
    '</div>' +

    '<div id="report-body">' + reportBody(term) + '</div>';

  el('report-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');

  });

function reportBody(term) {
  if (S.reportTab === 'collection') return reportCollection(term);
  if (S.reportTab === 'aging') return reportAging();
  if (!S.analytics) return '<div class="empty"><p>Loading marks and registers…</p></div>';
  if (S.reportTab === 'attendance') return reportAttendance();
  if (S.reportTab === 'performance') return reportPerformance();
  return reportTeachers();
}

/* ---- fee collection analytics ---- */
function reportCollection(term) {
  const rows = S.classes.map((c) => {
    const inClass = studentsIn(c.id);
    // Named `charged`, not `billed`: a local called `billed` shadows the
    // billed() function and every call in this loop throws.
    let charged = 0, paid = 0;

    inClass.forEach((s) => {
      charged += billed(s, term);
      paid += paidBy(s.id, term);
    });

    return {
      name: c.name,
      count: inClass.length,
      billed: charged, paid,
      owing: Math.max(0, charged - paid),
      rate: charged ? Math.round((paid / charged) * 100) : null,
    };
  }).filter((r) => r.count > 0);

  const total = rows.reduce((a, r) => ({
    billed: a.billed + r.billed, paid: a.paid + r.paid, owing: a.owing + r.owing,
    count: a.count + r.count,
  }), { billed: 0, paid: 0, owing: 0, count: 0 });

  // Payment method mix: tells the bursar what to reconcile against.
  const methods = {};
  S.payments.filter((p) => p.term === term).forEach((p) => {
    methods[p.method] = (methods[p.method] || 0) + Number(p.amount || 0);
  });

  return '<div class="stats">' +
      stat('Billed', money(total.billed), total.count + ' students') +
      stat('Collected', money(total.paid),
        (total.billed ? Math.round((total.paid / total.billed) * 100) : 0) + '% of billing') +
      stat('Outstanding', money(total.owing), '') +
      stat('Receipts issued', S.payments.filter((p) => p.term === term).length, esc(term)) +
    '</div>' +

    '<div class="card" style="margin-top:18px;padding:0"><div class="scroll">' +
    '<table><thead><tr><th>Class</th><th class="num">Students</th>' +
    '<th class="num">Billed</th><th class="num">Collected</th>' +
    '<th class="num">Outstanding</th><th class="num">Rate</th></tr></thead><tbody>' +
    rows.map((r) =>
      '<tr><td>' + esc(r.name) + '</td><td class="num">' + r.count + '</td>' +
      '<td class="num">' + money(r.billed) + '</td>' +
      '<td class="num">' + money(r.paid) + '</td>' +
      '<td class="num">' + money(r.owing) + '</td>' +
      '<td class="num">' + (r.rate === null ? '—' :
        '<span class="tag ' + (r.rate >= 80 ? 'ok' : r.rate >= 50 ? 'warn' : 'bad') + '">' +
        r.rate + '%</span>') + '</td></tr>').join('') +
    '</tbody></table></div></div>' +

    (Object.keys(methods).length
      ? '<div class="card" style="margin-top:18px"><h2>How money came in</h2>' +
        '<div class="scroll"><table><tbody>' +
        Object.entries(methods).sort((a, b) => b[1] - a[1]).map(([m, v]) =>
          '<tr><td>' + esc(m) + '</td><td class="num">' + money(v) + '</td>' +
          '<td class="num hint">' + Math.round((v / total.paid) * 100) + '%</td></tr>').join('') +
        '</tbody></table></div>' +
        '<p class="hint">Reconcile the bank and mobile money figures against the ' +
        'statements before closing the term.</p></div>'
      : '');
}

/* ---- arrears, oldest first ---- */
function reportAging() {
  const buckets = S.config.terms.map((t) => ({ term: t, owing: 0, students: 0 }));

  activeStudents().forEach((s) => {
    S.config.terms.forEach((t, i) => {
      const due = billed(s, t) - paidBy(s.id, t);
      if (due > 0) { buckets[i].owing += due; buckets[i].students++; }
    });
  });

  const debtors = activeStudents().map((s) => {
    const total = S.config.terms.reduce((a, t) =>
      a + Math.max(0, billed(s, t) - paidBy(s.id, t)), 0);
    return { s, total };
  }).filter((r) => r.total > 0).sort((a, b) => b.total - a.total);

  return '<div class="card"><h2>Outstanding by term</h2><div class="scroll">' +
    '<table><thead><tr><th>Term</th><th class="num">Students owing</th>' +
    '<th class="num">Amount</th></tr></thead><tbody>' +
    buckets.map((b) =>
      '<tr><td>' + esc(b.term) + '</td><td class="num">' + b.students + '</td>' +
      '<td class="num">' + money(b.owing) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<p class="hint">A balance still showing against Term 1 in Term 3 is the ' +
    'figure to act on — it has survived two reminder cycles.</p></div>' +

    '<div class="card" style="margin-top:18px;padding:0"><div class="scroll">' +
    '<table><thead><tr><th>Student</th><th>Class</th>' +
    '<th class="num">Total owing</th></tr></thead><tbody>' +
    (debtors.length
      ? debtors.slice(0, 60).map((r) =>
          '<tr><td><button class="btn ghost small" data-student="' + r.s.id + '">' +
          esc(r.s.name) + '</button><br><span class="hint">' + esc(r.s.adm) + '</span></td>' +
          '<td>' + esc(className(r.s.classId)) + '</td>' +
          '<td class="num"><span class="tag bad">' + money(r.total) + '</span></td></tr>').join('')
      : '<tr><td colspan="3" class="hint" style="padding:20px">Nothing outstanding.</td></tr>') +
    '</tbody></table></div></div>';
}

/* ---- attendance trends ---- */
function reportAttendance() {
  const classRows = S.classes.map((c) => {
    const inClass = studentsIn(c.id);
    const tally = { P: 0, A: 0, L: 0, E: 0 };

    inClass.forEach((s) => {
      const t = studentAttendance(s.id);
      Object.keys(tally).forEach((k) => { tally[k] += t[k]; });
    });

    return { name: c.name, count: inClass.length, tally, rate: attendanceRate(tally) };
  }).filter((r) => r.count > 0);

  const worst = activeStudents().map((s) => {
    const tally = studentAttendance(s.id);
    return { s, tally, rate: attendanceRate(tally), absent: tally.A };
  }).filter((r) => r.absent > 0).sort((a, b) => b.absent - a.absent).slice(0, 20);

  // Registers taken per day, which shows whether marking is actually happening.
  const byDate = {};
  S.analytics.attendance.forEach((doc) => {
    const date = doc.id.split('_').slice(1).join('_');
    byDate[date] = (byDate[date] || 0) + 1;
  });
  const days = Object.keys(byDate).sort().slice(-14);

  return '<div class="card"><h2>Attendance by class</h2><div class="scroll">' +
    '<table><thead><tr><th>Class</th><th class="num">Present</th><th class="num">Late</th>' +
    '<th class="num">Absent</th><th class="num">Excused</th><th class="num">Rate</th>' +
    '</tr></thead><tbody>' +
    (classRows.length ? classRows.map((r) =>
      '<tr><td>' + esc(r.name) + '</td>' +
      '<td class="num">' + r.tally.P + '</td><td class="num">' + r.tally.L + '</td>' +
      '<td class="num">' + r.tally.A + '</td><td class="num">' + r.tally.E + '</td>' +
      '<td class="num">' + (r.rate === null ? '<span class="hint">not marked</span>' :
        '<span class="tag ' + (r.rate >= 90 ? 'ok' : r.rate >= 75 ? 'warn' : 'bad') + '">' +
        r.rate + '%</span>') + '</td></tr>').join('')
      : '<tr><td colspan="6" class="hint" style="padding:20px">No registers taken yet.</td></tr>') +
    '</tbody></table></div>' +
    '<p class="hint">Excused absences are left out of the rate entirely — they are ' +
    'neither attendance nor a mark against the student.</p></div>' +

    (days.length ? '<div class="card" style="margin-top:18px"><h2>Registers taken, last 14 days</h2>' +
      '<div class="scroll"><table><tbody>' +
      days.map((d) => '<tr><td>' + esc(d) + '</td><td class="num">' + byDate[d] +
        ' of ' + S.classes.length + ' classes</td>' +
        '<td class="num">' + (byDate[d] < S.classes.length
          ? '<span class="tag warn">incomplete</span>' : '<span class="tag ok">complete</span>') +
        '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<p class="hint">A day short of registers cannot be reconstructed later. ' +
      'This is the list to chase the same afternoon.</p></div>' : '') +

    (worst.length ? '<div class="card" style="margin-top:18px;padding:0"><div class="scroll">' +
      '<table><thead><tr><th>Most days absent</th><th>Class</th>' +
      '<th class="num">Absent</th><th class="num">Rate</th></tr></thead><tbody>' +
      worst.map((r) =>
        '<tr><td><button class="btn ghost small" data-student="' + r.s.id + '">' +
        esc(r.s.name) + '</button></td>' +
        '<td>' + esc(className(r.s.classId)) + '</td>' +
        '<td class="num">' + r.absent + '</td>' +
        '<td class="num">' + (r.rate === null ? '—' : r.rate + '%') + '</td></tr>').join('') +
      '</tbody></table></div></div>' : '');
}

/* ---- class and subject performance ---- */
function reportPerformance() {
  const rows = [];

  S.classes.forEach((c) => {
    S.subjects.forEach((sub) => {
      const marks = [];
      studentsIn(c.id).forEach((s) => {
        studentMarks(s.id)
          .filter((m) => m.classId === c.id && m.subjectId === sub.id && m.percent !== null)
          .forEach((m) => marks.push(m.percent));
      });

      if (!marks.length) return;

      const avg = marks.reduce((a, b) => a + b, 0) / marks.length;
      rows.push({
        klass: c.name,
        subject: sub.name,
        marked: marks.length,
        average: Math.round(avg * 10) / 10,
        passing: Math.round((marks.filter((m) => m >= 50).length / marks.length) * 100),
        top: Math.max(...marks),
        low: Math.min(...marks),
      });
    });
  });

  rows.sort((a, b) => a.average - b.average);

  const classAvg = {};
  rows.forEach((r) => {
    classAvg[r.klass] = classAvg[r.klass] || [];
    classAvg[r.klass].push(r.average);
  });

  return (rows.length === 0
    ? '<div class="empty"><p>No marks entered yet, so there is nothing to compare.</p></div>'
    : '<div class="card"><h2>Average by class</h2><div class="scroll">' +
      '<table><thead><tr><th>Class</th><th class="num">Subjects marked</th>' +
      '<th class="num">Average</th></tr></thead><tbody>' +
      Object.entries(classAvg).map(([k, list]) => {
        const avg = Math.round((list.reduce((a, b) => a + b, 0) / list.length) * 10) / 10;
        return '<tr><td>' + esc(k) + '</td><td class="num">' + list.length + '</td>' +
          '<td class="num"><span class="tag ' + (avg >= 60 ? 'ok' : avg >= 50 ? 'warn' : 'bad') +
          '">' + avg + '%</span></td></tr>';
      }).join('') +
      '</tbody></table></div></div>' +

      '<div class="card" style="margin-top:18px;padding:0"><div class="scroll">' +
      '<table><thead><tr><th>Class</th><th>Subject</th><th class="num">Marked</th>' +
      '<th class="num">Average</th><th class="num">Passing</th>' +
      '<th class="num">Range</th><th>Taught by</th></tr></thead><tbody>' +
      rows.map((r) => {
        const klass = S.classes.find((c) => c.name === r.klass);
        const sub = S.subjects.find((x) => x.name === r.subject);
        const who = klass && sub ? teachersOf(klass.id, sub.id) : [];

        return '<tr><td>' + esc(r.klass) + '</td><td>' + esc(r.subject) + '</td>' +
          '<td class="num">' + r.marked + '</td>' +
          '<td class="num">' + r.average + '%</td>' +
          '<td class="num"><span class="tag ' + (r.passing >= 75 ? 'ok' :
            r.passing >= 50 ? 'warn' : 'bad') + '">' + r.passing + '%</span></td>' +
          '<td class="num hint">' + r.low + '–' + r.top + '</td>' +
          '<td class="hint">' + (who.length ? esc(who.join(', ')) : 'unassigned') + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div>' +

      '<p class="hint" style="margin-top:12px">Sorted worst average first, which is ' +
      'where a head teacher should look. A low average with a high pass rate means ' +
      'a hard paper; a high average with a low pass rate means a split class.</p>');
}

/* ---- teacher activity ---- */
function reportTeachers() {
  const rows = S.teachers.map((t) => {
    const mine = assignmentsFor(t.id);
    let entered = 0, expected = 0;

    mine.forEach((a) => {
      const roll = studentsIn(a.classId);
      expected += roll.length;
      roll.forEach((s) => {
        if (studentMarks(s.id).some((m) =>
          m.classId === a.classId && m.subjectId === a.subjectId)) entered++;
      });
    });

    const homeroom = S.classes.filter((c) => c.classTeacherId === t.id);
    let registers = 0;
    homeroom.forEach((c) => {
      registers += S.analytics.attendance.filter((d) => d.id.startsWith(c.id + '_')).length;
    });

    return {
      name: t.name,
      assignments: mine.length,
      entered, expected,
      coverage: expected ? Math.round((entered / expected) * 100) : null,
      homeroom: homeroom.map((c) => c.name).join(', '),
      registers,
    };
  });

  return '<div class="card" style="padding:0"><div class="scroll">' +
    '<table><thead><tr><th>Teacher</th><th class="num">Assignments</th>' +
    '<th class="num">Marks entered</th><th class="num">Coverage</th>' +
    '<th>Class teacher of</th><th class="num">Registers</th></tr></thead><tbody>' +
    (rows.length ? rows.map((r) =>
      '<tr><td>' + esc(r.name) + '</td>' +
      '<td class="num">' + r.assignments + '</td>' +
      '<td class="num">' + r.entered + ' of ' + r.expected + '</td>' +
      '<td class="num">' + (r.coverage === null ? '<span class="hint">—</span>' :
        '<span class="tag ' + (r.coverage >= 90 ? 'ok' : r.coverage >= 50 ? 'warn' : 'bad') +
        '">' + r.coverage + '%</span>') + '</td>' +
      '<td>' + (r.homeroom ? esc(r.homeroom) : '<span class="hint">—</span>') + '</td>' +
      '<td class="num">' + r.registers + '</td></tr>').join('')
      : '<tr><td colspan="6" class="hint" style="padding:20px">No teachers added yet.</td></tr>') +
    '</tbody></table></div></div>' +

    '<p class="hint" style="margin-top:12px">Coverage is how much of the marking a ' +
    'teacher has actually done for the classes assigned to them. Read it as a ' +
    'prompt before a deadline, not a verdict — an unmarked class may simply not ' +
    'have sat the paper yet.</p>';
}

/* ------------------- student profile and report card ------------------- */

/**
 * One student, everything about them: profile, guardians, class history,
 * fee statement, marks and attendance. Opened from any list in the portal,
 * because "click the name" is what everyone tries first.
 */
async function openStudent(studentId) {
  const s = S.students.find((x) => x.id === studentId);
  if (!s) return;

  S.openStudentId = studentId;

  // Always re-read: opening a profile is rare enough that a fresh read costs
  // nothing, and showing a stale "no marks yet" is expensive in trust.
  openModal('<h3>' + esc(s.name) + '</h3><p class="hint">Loading records…</p>');
  await loadAnalytics();
  if (!S.promotions) await loadPromotions();

  drawStudent();
}

function drawStudent() {
  const s = S.students.find((x) => x.id === S.openStudentId);
  if (!s) return closeModal();

  const writable = canWrite('students');
  const guardians = s.guardians || (s.guardian
    ? [{ name: s.guardian, phone: s.phone || '', relationship: '', primary: true }]
    : []);

  // Fees across every term, not just the current one — arrears are the point.
  const terms = S.config.terms.map((t) => ({
    term: t,
    billed: billed(s, t),
    paid: paidBy(s.id, t),
  }));
  const owed = terms.reduce((a, t) => a + Math.max(0, t.billed - t.paid), 0);

  const receipts = S.payments
    .filter((p) => p.studentId === s.id)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));

  const marks = studentMarks(s.id);
  const tally = studentAttendance(s.id);
  const rate = attendanceRate(tally);
  const history = classHistory(s.id);

  const bySubject = {};
  marks.forEach((m) => {
    if (m.percent === null) return;
    bySubject[m.subjectId] = bySubject[m.subjectId] || [];
    bySubject[m.subjectId].push(m.percent);
  });

  const subjectRows = Object.entries(bySubject).map(([subjectId, list]) => {
    const avg = Math.round((list.reduce((a, b) => a + b, 0) / list.length) * 10) / 10;
    const band = bandFor(avg);
    return { name: subjectName(subjectId), avg, band };
  }).sort((a, b) => b.avg - a.avg);

  const overall = subjectRows.length
    ? Math.round((subjectRows.reduce((a, r) => a + r.avg, 0) / subjectRows.length) * 10) / 10
    : null;

  openModal(
    '<h3>' + esc(s.name) + '</h3>' +
    '<p class="hint" style="margin-top:-8px">' + esc(s.adm) + ' · ' +
      esc(className(s.classId)) + ' · ' +
      (isNewStudent(s) ? 'billed as new' : 'returning student') + '</p>' +

    /* ---- profile ---- */
    '<table style="margin-top:14px"><tbody>' +
      row('Date of birth', s.dob || '—') +
      row('Gender', s.gender || '—') +
      row('Status', s.status || '—') +
      row('Admitted', s.admitted || '—') +
    '</tbody></table>' +

    /* ---- class history ---- */
    (history.length
      ? '<h4 style="margin:18px 0 6px;font-size:13px">Class history</h4>' +
        '<div class="scroll"><table><tbody>' +
        history.map((h) =>
          '<tr><td class="hint">' + esc(h.date) + '</td>' +
          '<td>' + esc(h.fromName) + ' \u2192 ' + esc(h.toName || '\u2014') + '</td>' +
          '<td class="hint">' + esc(MOVE_LABEL[h.reason] || h.reason) + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '') +

    /* ---- guardians ---- */
    '<h4 style="margin:18px 0 6px;font-size:13px">Guardians</h4>' +
    (guardians.length
      ? '<table><tbody>' + guardians.map((g, i) =>
          '<tr><td>' + esc(g.name) +
          (g.relationship ? ' <span class="hint">' + esc(g.relationship) + '</span>' : '') +
          (g.primary ? ' <span class="tag">primary</span>' : '') +
          (g.feePayer ? ' <span class="tag">pays fees</span>' : '') + '</td>' +
          '<td class="hint">' + esc(g.phone || '—') + '</td>' +
          (writable ? '<td class="num"><button class="btn ghost small" data-delguardian="' +
            i + '">Remove</button></td>' : '') + '</tr>').join('') +
        '</tbody></table>'
      : '<p class="hint">No guardian recorded. Fee reminders have nowhere to go.</p>') +
    (writable ? '<button class="btn ghost small" id="add-guardian" style="margin-top:8px">' +
      'Add a guardian</button>' : '') +

    /* ---- fees ---- */
    '<h4 style="margin:18px 0 6px;font-size:13px">Fees</h4>' +
    '<div class="scroll"><table><thead><tr><th>Term</th><th class="num">Billed</th>' +
    '<th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>' +
    terms.map((t) => {
      const due = t.billed - t.paid;
      return '<tr><td>' + esc(t.term) + '</td>' +
        '<td class="num">' + money(t.billed) + '</td>' +
        '<td class="num">' + money(t.paid) + '</td>' +
        '<td class="num">' + (due > 0 ? '<span class="tag bad">' + money(due) + '</span>'
          : due < 0 ? '<span class="tag warn">' + money(-due) + ' credit</span>'
          : '<span class="tag ok">settled</span>') + '</td></tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<p class="hint">Owing across the year: <b>' + money(owed) + '</b></p>' +

    (receipts.length
      ? '<h4 style="margin:18px 0 6px;font-size:13px">Receipts</h4>' +
        '<div class="scroll"><table><tbody>' +
        receipts.slice(0, 8).map((p) =>
          '<tr><td class="receipt">' + esc(p.receipt) + '</td>' +
          '<td class="hint">' + esc(p.date) + '</td>' +
          '<td class="hint">' + esc(p.method) + '</td>' +
          '<td class="num">' + money(p.amount) + '</td>' +
          '<td class="num"><button class="btn ghost small" data-printreceipt="' +
            esc(p.id) + '">Print</button></td></tr>').join('') +
        '</tbody></table></div>'
      : '') +

    /* ---- academics ---- */
    '<h4 style="margin:18px 0 6px;font-size:13px">Marks</h4>' +
    (subjectRows.length
      ? '<div class="scroll"><table><thead><tr><th>Subject</th>' +
        '<th class="num">Average</th><th>Grade</th></tr></thead><tbody>' +
        subjectRows.map((r) =>
          '<tr><td>' + esc(r.name) + '</td><td class="num">' + r.avg + '%</td>' +
          '<td><span class="tag ' + (r.avg >= 50 ? 'ok' : 'bad') + '">' +
          esc(r.band.letter) + '</span></td></tr>').join('') +
        '</tbody></table></div>' +
        '<p class="hint">Overall average <b>' + overall + '%</b> · grade <b>' +
          esc(bandFor(overall).letter) + '</b></p>'
      : '<p class="hint">No marks entered yet.</p>') +

    '<h4 style="margin:18px 0 6px;font-size:13px">Attendance</h4>' +
    (rate === null
      ? '<p class="hint">Not yet marked in any register.</p>'
      : '<p class="hint">' + rate + '% · present ' + tally.P + ', late ' + tally.L +
        ', absent ' + tally.A + ', excused ' + tally.E + '</p>') +

    '<div class="foot">' +
      '<button class="btn ghost" id="print-card" style="margin-right:auto">Report card</button>' +
      (writable ? '<button class="btn ghost" id="move-student">Move class</button>' : '') +
      (writable ? '<button class="btn ghost" id="edit-student">Edit</button>' : '') +
      '<button class="btn" onclick="closeModal()">Close</button>' +
    '</div>',
    () => {
      const edit = el('edit-student');
      if (edit) edit.addEventListener('click', () => studentForm(s));

      const move = el('move-student');
      if (move) move.addEventListener('click', () => moveStudentForm(s));

      el('print-card').addEventListener('click', async (e) => {
        const b = e.currentTarget;
        b.disabled = true;
        b.textContent = 'Preparing…';
        try { await printReportCard(s); }
        finally { b.disabled = false; b.textContent = 'Report card'; }
      });

      el('modal').querySelectorAll('[data-printreceipt]').forEach((b) => {
        b.addEventListener('click', () => {
          const p = S.payments.find((x) => x.id === b.dataset.printreceipt);
          if (p) printReceipt(p, s);
        });
      });

      const add = el('add-guardian');
      if (add) add.addEventListener('click', () => guardianForm(s));

      el('modal').querySelectorAll('[data-delguardian]').forEach((b) => {
        b.addEventListener('click', async () => {
          const list = (s.guardians || []).slice();
          list.splice(Number(b.dataset.delguardian), 1);
          const body = Object.assign({}, s, { guardians: list });
          delete body.id;
          if (!(await save('students/' + s.id, body))) return;
          Object.assign(s, { guardians: list });
          drawStudent();
          toast('Guardian removed.');
        });
      });
    }
  );
}

function row(label, value) {
  return '<tr><td class="hint" style="width:40%">' + esc(label) + '</td><td>' +
    esc(value) + '</td></tr>';
}

function guardianForm(s) {
  if (!guard('students')) return;

  openModal(
    '<h3>Add a guardian</h3>' +
    '<p class="hint" style="margin-top:-8px">for ' + esc(s.name) + '</p>' +
    '<label class="f"><span>Full name</span><input type="text" id="g-name"></label>' +
    '<div class="row2">' +
      '<label class="f"><span>Relationship</span><input type="text" id="g-rel" ' +
        'placeholder="Father, Aunt, Sponsor"></label>' +
      '<label class="f"><span>Phone</span><input type="text" id="g-phone"></label>' +
    '</div>' +
    '<label class="check"><input type="checkbox" id="g-primary" checked> ' +
      'Primary contact</label>' +
    '<label class="check"><input type="checkbox" id="g-fees" checked> ' +
      'Receives fee reminders</label>' +
    '<p class="hint">Siblings can share a guardian — add the same phone number ' +
    'to each child and the office will see the connection.</p>' +
    '<div class="foot">' +
      '<button class="btn ghost" id="g-cancel">Back</button>' +
      '<button class="btn" id="g-save">Add guardian</button>' +
    '</div>',
    () => {
      el('g-cancel').addEventListener('click', drawStudent);

      el('g-save').addEventListener('click', async () => {
        const name = el('g-name').value.trim();
        if (!name) return toast('A name is required.', true);

        const entry = {
          name,
          relationship: el('g-rel').value.trim(),
          phone: el('g-phone').value.trim(),
          primary: el('g-primary').checked,
          feePayer: el('g-fees').checked,
        };

        const list = (s.guardians || []).concat([entry]);
        const body = Object.assign({}, s, { guardians: list });
        delete body.id;

        if (!(await save('students/' + s.id, body))) return;
        Object.assign(s, { guardians: list });
        drawStudent();
        toast(name + ' added.');
      });
    }
  );
}

async function printReportCard(student) {
  // The cache is dropped whenever marks are saved, but a mark entered in
  // another tab, or by another member of staff, will not have dropped it
  // here. So re-read once before telling anyone there is nothing to print —
  // "no marks entered" when marks plainly exist is the worst answer to give.
  if (!S.analytics) await loadAnalytics();

  let marks = studentMarks(student.id);

  if (!marks.some((m) => m.percent !== null)) {
    await loadAnalytics();
    marks = studentMarks(student.id);
  }

  const term = S.config.currentTerm;

  const bySubject = {};
  marks.filter((m) => m.percent !== null).forEach((m) => {
    bySubject[m.subjectId] = bySubject[m.subjectId] || [];
    bySubject[m.subjectId].push(m);
  });

  if (!Object.keys(bySubject).length) {
    return toast(
      'No marks found for ' + student.name + '. Enter marks under Grades for '
      + className(student.classId) + ' first.', true
    );
  }

  // Position within the class, per subject.
  const roll = studentsIn(student.classId);
  const rows = Object.entries(bySubject).map(([subjectId, list]) => {
    const avg = list.reduce((a, m) => a + m.percent, 0) / list.length;

    const peers = roll.map((s) => {
      const theirs = studentMarks(s.id)
        .filter((m) => m.subjectId === subjectId && m.percent !== null);
      return theirs.length
        ? theirs.reduce((a, m) => a + m.percent, 0) / theirs.length
        : null;
    }).filter((v) => v !== null).sort((a, b) => b - a);

    const position = peers.findIndex((v) => Math.abs(v - avg) < 0.05) + 1;

    return {
      subject: subjectName(subjectId),
      avg: Math.round(avg * 10) / 10,
      band: bandFor(avg),
      position: position || null,
      outOf: peers.length,
      complete: list.every((m) => m.complete),
    };
  }).sort((a, b) => a.subject.localeCompare(b.subject));

  const overall = Math.round(
    (rows.reduce((a, r) => a + r.avg, 0) / rows.length) * 10
  ) / 10;
  const band = bandFor(overall);
  const tally = studentAttendance(student.id);
  const rate = attendanceRate(tally);
  const incomplete = rows.some((r) => !r.complete);

  printDocument('Report card — ' + student.name,
    '<h2>Terminal report · ' + esc(term) + ', ' + esc(S.config.year) + '</h2>' +

    '<table class="meta"><tbody>' +
      '<tr><td>Student</td><td><b>' + esc(student.name) + '</b></td></tr>' +
      '<tr><td>Student ID</td><td>' + esc(student.adm) + '</td></tr>' +
      '<tr><td>Class</td><td>' + esc(className(student.classId)) +
        ' · ' + roll.length + ' on roll</td></tr>' +
    '</tbody></table>' +

    '<table><thead><tr><th>Subject</th><th class="n">Mark</th>' +
    '<th>Grade</th><th>Remark</th><th class="n">Position</th></tr></thead><tbody>' +
    rows.map((r) =>
      '<tr><td>' + esc(r.subject) + (r.complete ? '' : ' *') + '</td>' +
      '<td class="n">' + r.avg + '</td>' +
      '<td>' + esc(r.band.letter) + '</td>' +
      '<td>' + esc(r.band.note) + '</td>' +
      '<td class="n">' + (r.position ? r.position + ' of ' + r.outOf : '—') + '</td></tr>').join('') +
    '<tr class="sum"><td>Overall average</td><td class="n">' + overall + '</td>' +
    '<td>' + esc(band.letter) + '</td><td>' + esc(band.note) + '</td><td></td></tr>' +
    '</tbody></table>' +

    '<table class="meta"><tbody>' +
      '<tr><td>Attendance</td><td>' + (rate === null ? 'not recorded'
        : rate + '% · ' + tally.A + ' day(s) absent, ' + tally.L + ' late') + '</td></tr>' +
      '<tr><td>Subjects</td><td>' + rows.length + ' assessed</td></tr>' +
    '</tbody></table>' +

    (incomplete
      ? '<p style="font-size:11px;color:#8f2a25">* Not all assessment components ' +
        'have been marked for this subject. The mark shown is scaled to what has ' +
        'been recorded and will change when the remaining papers are entered.</p>'
      : '') +

    '<div class="sign"><div>Class teacher</div><div>Head teacher</div>' +
    '<div>Parent / guardian</div></div>'
  );
}

  }

  el('seed').disabled = true;
  el('seed').textContent = 'Loading…';

  // Real levels and real fees, so the demo reflects the actual bill.
  await loadHoaFees();

  const classes = S.classes;
  const spread = ['ECD Level 2', 'Grade 1-3', 'Grade 4-6', 'Grade 7', 'Grade 9']
    .map((name) => classes.find((c) => c.name === name))
    .filter(Boolean);

  const subjects = ['Mathematics', 'English Language', 'Integrated Science',
    'Social Studies', 'Quranic Studies', 'Physical Education']
    .map((name) => ({ id: uid(), name }));

  const names = [
    'Muhammed Jatta', 'Fatoumata Ceesay', 'Amadou Sanneh', 'Isatou Bah',
    'Lamin Touray', 'Mariama Jallow', 'Ebrima Camara', 'Aminata Njie',
    'Ousman Darboe', 'Binta Sow', 'Modou Faal', 'Jankeba Kanteh',
  ];

  const term = S.config.currentTerm;

  const students = names.map((name, i) => ({
    id: uid(),
    name,
    adm: 'HOA-2026-' + String(i + 1).padStart(4, '0'),
    dob: (2013 + (i % 3)) + '-0' + ((i % 9) + 1) + '-1' + (i % 9),
    gender: i % 2 ? 'Female' : 'Male',
    classId: spread[i % spread.length].id,
    isNew: i % 3 !== 0,   // a third are returning students, to show both rates
    guardian: ['Mr', 'Mrs'][i % 2] + ' ' + name.split(' ')[1],
    phone: '44' + (70 + i) + ' ' + (100 + i * 7),
    status: 'Active',
    admitted: today(),
  }));

  try {
    await save('config/subjects', { items: subjects });

    const promises = [];

    students.forEach((s) => {
      const body = Object.assign({}, s);
      delete body.id;
      promises.push(db.doc('students/' + s.id).set(body));
    });

    // A few payments so the fees screen has something in it.
    const payments = [];
    students.slice(0, 7).forEach((s, i) => {
      const id = uid();
      const full = billed(s, term);
      const amount = i % 3 === 0 ? full : Math.round(full * 0.4);
      const body = {
        studentId: s.id, amount, date: today(), term,
        method: ['Cash', 'Mobile money', 'Bank transfer'][i % 3],
        reference: '', receipt: 'RCP-' + String(i + 1).padStart(5, '0'),
        recordedAt: new Date().toISOString(),
      };
      payments.push(Object.assign({ id }, body));
      promises.push(db.doc('payments/' + id).set(body));
    });

    await Promise.all(promises);

    S.subjects = subjects;
    S.students = students;
    S.payments = payments;

    S.page = 'dashboard';
    render();
    toast('Sample data loaded.');
  } catch (error) {
    console.error(error);
    toast('Could not load all the sample data.', true);
    await loadAll();
    render();
  }
}

boot();
</script>
</body>
</html>
