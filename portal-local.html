<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hands-On Academy — Administration Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Hands-On Academy portal — visual system

     Borders do the least work possible: one hairline at 1px, nothing
     heavier, and no rule anywhere that a whitespace gap could do instead.
     Colour carries meaning, not decoration — red appears on the active nav
     item, the one primary action per screen, and overdue money. Everything
     else is greyscale.
     ===================================================================== */
  :root {
    --bg:            #f6f7f9;
    --surface:       #ffffff;
    --surface-2:     #f9fafb;
    --surface-3:     #f2f4f7;

    --border:        #e4e7ec;
    --border-strong: #d0d5dd;

    --text:          #101828;
    --text-2:        #475467;
    --text-3:        #667085;

    --brand:         #bf3c36;
    --brand-dark:    #a2312c;
    --brand-tint:    #fef3f2;
    --brand-border:  #f4c4c1;

    --good:          #067647;
    --good-tint:     #ecfdf3;
    --good-border:   #abefc6;

    --warn:          #b54708;
    --warn-tint:     #fffaeb;
    --warn-border:   #fedf89;

    --bad:           #b42318;
    --bad-tint:      #fef3f2;
    --bad-border:    #fecdca;

    --ink:           #1d2939;

    --radius:        8px;
    --radius-sm:     6px;
    --shadow-xs:     0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-sm:     0 1px 3px rgba(16, 24, 40, 0.10), 0 1px 2px rgba(16, 24, 40, 0.06);
    --shadow-lg:     0 20px 24px -4px rgba(16, 24, 40, 0.08), 0 8px 8px -4px rgba(16, 24, 40, 0.03);

    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --serif: 'Newsreader', Georgia, serif;

    /* Kept so older markup in the file still resolves. */
    --paper: var(--bg);
    --card: var(--surface);
    --line: var(--border);
    --line-soft: var(--surface-3);
    --muted: var(--text-3);
    --red-brand: var(--brand);
    --green: var(--good);
    --red: var(--bad);
    --amber: var(--warn);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141a;         --surface: #1a1d24;    --surface-2: #21252e;
      --surface-3: #282d37;  --border: #2f353f;     --border-strong: #3d444f;
      --text: #f0f2f5;       --text-2: #b0b7c3;     --text-3: #8c95a3;
      --brand: #e07a74;      --brand-dark: #c9635d; --brand-tint: #2a1a19;
      --brand-border: #4d2c2a;
      --good: #6ce9a6;  --good-tint: #132b20;  --good-border: #24503a;
      --warn: #fdb022;  --warn-tint: #2b2113;  --warn-border: #54401c;
      --bad:  #fda29b;  --bad-tint:  #2b1917;  --bad-border:  #542b27;
      --ink: #f0f2f5;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 20px 24px -4px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --surface: #1a1d24; --surface-2: #21252e; --surface-3: #282d37;
    --border: #2f353f; --border-strong: #3d444f;
    --text: #f0f2f5; --text-2: #b0b7c3; --text-3: #8c95a3;
    --brand: #e07a74; --brand-dark: #c9635d; --brand-tint: #2a1a19;
    --brand-border: #4d2c2a;
    --good: #6ce9a6; --good-tint: #132b20; --good-border: #24503a;
    --warn: #fdb022; --warn-tint: #2b2113; --warn-border: #54401c;
    --bad: #fda29b; --bad-tint: #2b1917; --bad-border: #542b27;
    --ink: #f0f2f5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    font-feature-settings: 'cv05' 1;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------------- shell ---------------- */
  .shell { display: grid; grid-template-columns: 244px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 0 24px;
    display: flex;
    flex-direction: column;
  }

  .brand { padding: 0 20px 24px; }
  /* The crest is line art on white. Given it a white plate of its own so
     that in dark mode it reads as a printed badge rather than a stray
     white rectangle where a logo used to be. */
  .brand img.logo {
    display: block; width: 100%; max-width: 168px;
    background: #fff; padding: 6px 8px; border-radius: 6px;
  }
  .brand span {
    display: block; margin-top: 10px;
    font-size: 12px; color: var(--text-3);
  }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
  .nav button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-radius: var(--radius-sm);
    padding: 8px 12px; color: var(--text-2); cursor: pointer;
    font-size: 14px; font-weight: 450;
    transition: background-color .12s ease, color .12s ease;
  }
  .nav button:hover { background: var(--surface-3); color: var(--text); }
  .nav button.on {
    background: var(--brand-tint); color: var(--brand-dark); font-weight: 600;
  }
  .nav button:focus-visible {
    outline: 2px solid var(--brand); outline-offset: -1px;
  }

  .whoami {
    margin-top: auto; padding: 20px 20px 0;
    border-top: 1px solid var(--border); margin-inline: 20px; padding-inline: 0;
    font-size: 12px; color: var(--text-3);
  }
  .whoami select {
    width: 100%; margin-top: 8px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 7px 10px; font-size: 13px;
  }

  @media (max-width: 900px) {
    .side { padding: 16px 0 8px; }
    .brand { padding: 0 16px 14px; }
    .brand img.logo { max-width: 132px; padding: 4px 6px; }
    .nav {
      flex-direction: row; overflow-x: auto; gap: 4px;
      padding: 0 12px 4px; scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav button { white-space: nowrap; width: auto; }
    .whoami {
      margin: 12px 16px 0; padding-top: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .whoami select { margin-top: 0; max-width: 200px; }
  }

  main {
    padding: 28px 32px 80px;
    min-width: 0;
    max-width: 1240px;
  }
  @media (max-width: 620px) { main { padding: 20px 16px 64px; } }

  .head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
  }
  h1 {
    font-size: 24px; font-weight: 600; margin: 0;
    letter-spacing: -0.02em; color: var(--text);
  }
  .head p { margin: 4px 0 0; color: var(--text-3); font-size: 14px; }
  .head > div:last-child { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------------- buttons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; white-space: nowrap;
    background: var(--brand); border: 1px solid var(--brand);
    color: #fff; font-size: 14px; font-weight: 500;
    padding: 8px 14px; border-radius: var(--radius-sm);
    cursor: pointer; box-shadow: var(--shadow-xs);
    transition: background-color .12s ease, border-color .12s ease;
  }
  .btn:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .btn:disabled {
    background: var(--surface-3); border-color: var(--border);
    color: var(--text-3); cursor: not-allowed; box-shadow: none;
  }

  .btn.ghost {
    background: var(--surface); color: var(--text);
    border-color: var(--border-strong); font-weight: 500;
  }
  .btn.ghost:hover { background: var(--surface-2); border-color: var(--border-strong); }

  .btn.green { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.green:hover { background: #101828; border-color: #101828; }

  .btn.small { padding: 5px 10px; font-size: 13px; box-shadow: none; }

  /* A name in a table is a link, not a button. */
  .btn.ghost.small[data-student],
  .btn.ghost.small[data-editteacher] {
    background: none; border: 0; padding: 0;
    color: var(--text); font-weight: 500;
    text-decoration: underline; text-decoration-color: var(--border-strong);
    text-underline-offset: 3px; box-shadow: none;
  }
  .btn.ghost.small[data-student]:hover {
    background: none; color: var(--brand-dark);
    text-decoration-color: var(--brand);
  }

  /* ---------------- cards ---------------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-xs);
    padding: 20px 22px;
    overflow: hidden;
  }
  .card h2 {
    margin: 0 0 16px; font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card > .scroll:first-child,
  .card[style*="padding:0"] > .scroll { border-radius: var(--radius); }

  /* ---------------- statistics ---------------- */
  .stats {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    background: none; border: 0;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-xs);
    padding: 16px 18px;
  }
  .stat .k {
    font-size: 12px; font-weight: 500; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .stat .v {
    font-family: var(--sans); font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em; margin-top: 6px; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat .n { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

  /* ---------------- tables ---------------- */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left; white-space: nowrap;
    font-size: 11.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 10px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  thead th:first-child { border-top-left-radius: var(--radius); }
  thead th:last-child { border-top-right-radius: var(--radius); }
  td {
    padding: 12px 14px; vertical-align: middle;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background-color .1s ease; }
  tbody tr:hover td { background: var(--surface-2); }
  td.num, th.num { text-align: right; }

  /* Bare tables inside cards (key/value lists) need no header chrome. */
  .card table th { background: none; }

  /* ---------------- tags ---------------- */
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 16px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
    background: var(--surface-3); color: var(--text-2);
    border: 1px solid transparent;
  }
  .tag.ok   { background: var(--good-tint); color: var(--good); border-color: var(--good-border); }
  .tag.bad  { background: var(--bad-tint);  color: var(--bad);  border-color: var(--bad-border); }
  .tag.warn { background: var(--warn-tint); color: var(--warn); border-color: var(--warn-border); }

  /* ---------------- forms ---------------- */
  label.f { display: block; margin-bottom: 16px; }
  label.f span {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text-2); margin-bottom: 6px;
  }

  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 9px 12px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-xs);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--text-3); }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-tint);
  }
  input[readonly] {
    background: var(--surface-2); color: var(--text-3);
    cursor: default; box-shadow: none;
  }
  input[readonly]:hover { border-color: var(--border-strong); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; gap: 0; } }

  .check {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 14px; font-size: 14px; color: var(--text);
  }
  .check input { width: auto; box-shadow: none; }
  input[type=checkbox] { accent-color: var(--brand); width: 16px; height: 16px; }

  /* Report tabs: one row, only the selected one filled. */
  #report-tabs {
    gap: 4px; padding: 3px; background: var(--surface-3);
    border-radius: var(--radius); display: inline-flex;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  #report-tabs .btn {
    background: none; border-color: transparent; box-shadow: none;
    color: var(--text-2); font-weight: 500;
  }
  #report-tabs .btn:hover { background: rgba(255,255,255,.6); color: var(--text); }
  #report-tabs .btn.ghost { background: none; border-color: transparent; }
  #report-tabs .btn:not(.ghost) {
    background: var(--surface); color: var(--text);
    box-shadow: var(--shadow-xs); font-weight: 600;
  }

  /* ---------------- filter bar ---------------- */
  .bar {
    display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .bar input[type=text] { max-width: 280px; }
  .bar select, .bar input[type=date] { width: auto; min-width: 150px; }

  /* ---------------- empty state ---------------- */
  .empty {
    padding: 44px 24px; text-align: center;
    color: var(--text-3);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty p { margin: 0 0 14px; }
  .empty p:last-child { margin-bottom: 0; }

  /* ---------------- modal ---------------- */
  .veil {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(16, 24, 40, 0.5);
    backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .veil.on { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    width: 100%; max-width: 480px;
    max-height: 88vh; overflow-y: auto;
    padding: 24px 26px;
  }
  .modal h3 {
    font-size: 18px; font-weight: 600; margin: 0 0 18px;
    letter-spacing: -0.01em;
  }
  .modal h4 {
    font-size: 11.5px !important; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .modal table { font-size: 13.5px; }
  .modal td { padding: 8px 10px; }
  .modal th { padding: 8px 10px; }
  .modal .foot {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  /* ---------------- toast ---------------- */
  #toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 60;
    transform: translate(-50%, 100px);
    background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    font-size: 13.5px; font-weight: 450;
    max-width: 90vw;
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
  }
  #toast.on { transform: translate(-50%, 0); }
  #toast.bad { background: var(--bad); }

  /* ---------------- attendance buttons ---------------- */
  .att { display: inline-flex; gap: 4px; }
  .att button {
    width: 34px; height: 30px; padding: 0;
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: all .1s ease;
  }
  .att button:hover:not(:disabled) { background: var(--surface-2); }
  .att button:disabled { opacity: .5; cursor: not-allowed; }
  .att button.on { color: #fff; }
  .att button.on[data-s="P"] { background: var(--good); border-color: var(--good); }
  .att button.on[data-s="A"] { background: var(--bad);  border-color: var(--bad); }
  .att button.on[data-s="L"] { background: var(--warn); border-color: var(--warn); }
  .att button.on[data-s="E"] { background: var(--text-3); border-color: var(--text-3); }

  /* ---------------- misc ---------------- */
  input.mark {
    width: 72px; text-align: right; padding: 6px 9px;
    font-variant-numeric: tabular-nums;
  }
  .receipt {
    font-variant-numeric: tabular-nums;
    font-size: 13px; color: var(--text-2);
  }
  .hint { font-size: 13px; color: var(--text-3); margin: 8px 0 0; }
  .hint b { color: var(--text-2); }

  .banner {
    background: var(--brand-tint);
    color: var(--brand-dark);
    border-bottom: 1px solid var(--brand-border);
    font-size: 13px; padding: 9px 20px; text-align: center;
  }
  .banner {
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .banner b { font-weight: 600; }
  .banner #banner-close {
    background: none; border: 0; cursor: pointer;
    color: inherit; opacity: .65; font-size: 19px; line-height: 1;
    padding: 0 2px; border-radius: 4px;
  }
  .banner #banner-close:hover { opacity: 1; }
  .banner #banner-close:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .hidden { display: none !important; }
  .boot { padding: 80px 24px; text-align: center; color: var(--text-3); }
  .boot code {
    background: var(--surface-3); padding: 1px 5px;
    border-radius: 4px; font-size: 13px;
  }

  /* ---------------- print ---------------- */
  @media print {
    .side, .banner, .bar, #toast, .veil, .head > div:last-child { display: none !important; }
    .shell { display: block; }
    main { padding: 0; max-width: none; }
    body { background: #fff; font-size: 11.5px; }
    .card, .stat {
      border-color: #d0d5dd; box-shadow: none;
      page-break-inside: avoid;
    }
    th { background: #f2f4f7 !important; }
    tbody tr:hover td { background: none; }
  }
</style>
</head>
<body>

<div id="boot" class="boot">Opening the portal…</div>

<div id="app" class="hidden">
  <div class="banner" id="banner"></div>
  <div class="shell">

/* ---------------------------------------------------------------
   The school store — book shop and uniform shop.

   DEFINED once; every movement after that is a row. What is on the
   shelf is computed from those rows and never stored, because a
   stored quantity is a number somebody can quietly correct, and a
   store whose figures can be quietly corrected is not a store.

   That also makes the split the school asked for fall out naturally:
     - the Proprietress defines items and records deliveries in
     - the store keeper records issues out, and nothing else

/* =====================================================================
   Local storage adapter.

   This build runs from a folder on your own computer with no server and
   no internet. It presents the same doc()/collection() surface the hosted
   version uses, so the rest of the code below is unchanged.

   The trade-off: data lives in THIS browser on THIS computer only. Clear
   your browsing data and it is gone. Use the Export button under Setup
   before you rely on anything here.
   ===================================================================== */
const LocalDB = {
  prefix: 'hoa:',

  _key(path) { return LocalDB.prefix + path; },

  doc(path) {
    const key = LocalDB._key(path);
    return {
      async get() {
        const raw = localStorage.getItem(key);
        return {
          exists: raw !== null,
          data: () => (raw === null ? null : JSON.parse(raw)),
        };
      },
      async set(body) {
        try {
          localStorage.setItem(key, JSON.stringify(body));
        } catch (error) {
          // Roughly 5 MB per site. Hit at maybe a few thousand students.
          if (error.name === 'QuotaExceededError') {
            throw Object.assign(new Error('Browser storage is full.'),
              { code: 'quota_exceeded' });
          }
          throw error;
        }
        return { key };
      },
      async delete() { localStorage.removeItem(key); return { key }; },
    };
  },

  collection(name) {
    const prefix = LocalDB.prefix + name + '/';
    return {
      async get() {
        const docs = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith(prefix)) continue;
          const raw = localStorage.getItem(k);
          docs.push({
            id: k.slice(prefix.length),
            data: () => JSON.parse(raw),
          });
        }
        return { docs };
      },
    };
  },

  /** Everything this app owns, as one object. */
  dump() {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LocalDB.prefix)) {
        out[k.slice(LocalDB.prefix.length)] = JSON.parse(localStorage.getItem(k));
      }
    }
    return out;
  },

  restore(data) {
    Object.entries(data).forEach(([path, value]) => {
      localStorage.setItem(LocalDB.prefix + path, JSON.stringify(value));
    });
  },

  wipe() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LocalDB.prefix)) keys.push(k);
    }
    keys.forEach((k) => localStorage.removeItem(k));
  },
};

/* --------------------------- helpers --------------------------- */
const el = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);

function money(n) {
  const cur = S.config?.currency || 'D';
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return cur + v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function bandFor(percent) {
  return GRADE_BANDS.find((b) => percent >= b.min) || GRADE_BANDS[GRADE_BANDS.length - 1];
}

function canWrite(area) {
  return !readOnly && (ROLE_WRITES[S.role] || []).includes(area);
}

const BANNER_KEY = 'hoa:banner-dismissed';

function paintBanner(html) {
  let dismissed = false;
  try { dismissed = localStorage.getItem(BANNER_KEY) === '1'; } catch (e) { /* fine */ }

  const bar = el('banner');

  if (dismissed) {
    bar.classList.add('hidden');
    return;
  }

  bar.classList.remove('hidden');
  bar.innerHTML = '<span>' + html + '</span>' +
    '<button id="banner-close" title="Dismiss" aria-label="Dismiss this notice">&times;</button>';

  el('banner-close').addEventListener('click', () => {
    try { localStorage.setItem(BANNER_KEY, '1'); } catch (e) { /* fine */ }
    bar.classList.add('hidden');
  });
}

function toast(message, bad) {
  const t = el('toast');
  t.textContent = message;
  t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 2800);
}

function guard(area) {
  if (canWrite(area)) return true;
  toast(readOnly ? 'This page is read-only for you.' : 'This role cannot change that.', true);
  return false;
}

async function save(path, body) {
  try {
    await db.doc(path).set(body);
    return true;
  } catch (error) {
    if (error && error.code === 'invalid_argument') {
      readOnly = true;
      render();
      toast('You do not have permission to save changes here.', true);
    } else if (error && error.code === 'quota_exceeded') {
      toast('The database is full. Delete old records first.', true);
    } else {
      toast('Could not save. Check your connection and try again.', true);
    }
    console.error('save failed', path, error);
    return false;
  }
}

/* --------------------------- modal --------------------------- */
function openModal(html, onMount) {
  el('modal').innerHTML = html;
  el('veil').classList.add('on');
  if (onMount) onMount();
  const first = el('modal').querySelector('input, select, textarea');

}
function closeModal() {

}
el('veil').addEventListener('click', (e) => { if (e.target.id === 'veil') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* --------------------------- derived data --------------------------- */
const className = (id) => (S.classes.find((c) => c.id === id) || {}).name || '—';
const subjectName = (id) => (S.subjects.find((s) => s.id === id) || {}).name || '—';
const activeStudents = () => S.students.filter((s) => s.status === 'Active');

function studentsIn(classId) {
  return activeStudents()
    .filter((s) => s.classId === classId)
    .sort((a, b) => a.name.localeCompare(b.name));
}

/** What a student is billed for one term: every fee item for their class. */
function billed(student, term) {
  const asNew = isNewStudent(student);

  return S.feeItems
    .filter((f) => f.classId === student.classId && f.term === term)
    .filter((f) => !f.newOnly || asNew)
    .reduce((sum, f) => sum + Number(f.amount || 0), 0);
}

/**
 * Registration, uniform and (in upper basic) the book bill are charged once,
 * to new students. The bill also states that Level 1, Grade 1 and Grade 7 are
 * always treated as new, because those are the entry points into each stage.
 */
function isNewStudent(student) {
  if (!student) return false;
  if (HOA_ALWAYS_NEW.includes(className(student.classId))) return true;
  return student.isNew !== false;
}

/** What the same student would pay under the other status — for the bill view. */
function billedAs(student, term, asNew) {
  return S.feeItems
    .filter((f) => f.classId === student.classId && f.term === term)
    .filter((f) => !f.newOnly || asNew)
    .reduce((sum, f) => sum + Number(f.amount || 0), 0);
}

/**
 * What a student has paid towards one term of the CURRENT year.
 *
 * Payments carry the year they were taken in. Without that, promoting a
 * pupil in September would leave last year's receipts counting against this
 * year's bill, and a family who had paid in full for Grade 4 would appear
 * to have paid their Grade 5 fees too.
 *
 * A payment with no year predates the stamp and is treated as belonging to
 * whatever year is current — closing the year stamps them all, so this only
 * ever applies to records made before the first year-end.
 */
function paidBy(studentId, term, year) {
  const y = year === undefined ? S.config.year : year;

  return S.payments
    .filter((p) => p.studentId === studentId
      && (term ? p.term === term : true)
      && (p.year === undefined || p.year === y))
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);
}

function feeSummary(term) {
  let bill = 0, paid = 0, owing = 0;
  activeStudents().forEach((s) => {
    const b = billed(s, term);
    const p = paidBy(s.id, term);
    bill += b; paid += p;
    if (b - p > 0) owing += b - p;
  });
  return { bill, paid, owing };
}

/**
 * Student IDs are generated, never typed: HOA-2026-0001.
 *
 * The stored field is still `adm` — renaming the key would orphan every
 * record already saved in this browser, and what changed is the label, not
 * the data.
 */
function nextStudentId() {
  const year = (S.config.year || '').slice(0, 4) || String(new Date().getFullYear());
  const used = S.students
    .map((s) => Number(String(s.adm || '').split('-').pop()))
    .filter((n) => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return 'HOA-' + year + '-' + String(next).padStart(4, '0');
}

function nextReceiptNumber() {
  const used = S.payments
    .map((p) => Number(String(p.receipt || '').split('-').pop()))
    .filter((n) => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return 'RCP-' + String(next).padStart(5, '0');
}

/* --------------------------- boot --------------------------- */
async function boot() {
  db = LocalDB;

  // Opening the file over file:// is fine, but some browsers refuse
  // localStorage there in private windows. Say so plainly rather than
  // failing silently on every save.
  try {
    localStorage.setItem('hoa:probe', '1');
    localStorage.removeItem('hoa:probe');
  } catch (error) {
    el('boot').innerHTML =
      '<p>This browser is blocking local storage, so nothing could be saved.</p>' +
      '<p>Try a normal window rather than a private one, or serve the folder ' +
      'with <code>python3 -m http.server</code> and open it over http://localhost.</p>';
    return;
  }

  await loadAll();

  el('boot').classList.add('hidden');
  el('app').classList.remove('hidden');
  render();
}

async function loadAll() {
  const [cfg, cls, sub, fee, tea, asg, stk, studentSnap, paySnap] = await Promise.all([
    db.doc('config/school').get(),
    db.doc('config/classes').get(),
    db.doc('config/subjects').get(),
    db.doc('config/fees').get(),
    db.doc('config/teachers').get(),
    db.doc('config/assignments').get(),
    db.doc('config/stock').get(),
    db.collection('students').get(),
    db.collection('payments').get(),
  ]);

  S.config = cfg.exists ? cfg.data() : {
    name: 'Hands-On Academy',
    currency: 'D',
    year: '2026/2027',
    terms: ['Term 1', 'Term 2', 'Term 3'],
    currentTerm: 'Term 1',
  };

  S.classes  = (cls.exists ? cls.data().items : []) || [];
  S.subjects = (sub.exists ? sub.data().items : []) || [];
  S.feeItems = (fee.exists ? fee.data().items : []) || [];
  S.teachers = (tea.exists ? tea.data().items : []) || [];
  S.assignments = (asg.exists ? asg.data().items : []) || [];
  S.stockItems = (stk.exists ? stk.data().items : []) || [];

  S.students = studentSnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  S.payments = paySnap.docs.map((d) => Object.assign({ id: d.id }, d.data()));

  S.gradeSel.term = S.config.currentTerm;
  S.attSel.date = today();
}

/* --------------------------- render --------------------------- */
function render() {
  el('brand-year').textContent = S.config.year + ' · ' + S.config.currentTerm;
  // Dismissible, and it stays dismissed. A warning that cannot be closed
  // stops being read after the second day, which is worse than no warning.
  paintBanner('<b>Local build.</b> Data is saved in this browser only \u2014 clearing your browsing data erases it. Export from Setup to keep a copy.');

  const allowed = ROLE_ALLOWS[S.role];
  if (!allowed.includes(S.page)) S.page = allowed[0];

  el('nav').innerHTML = PAGES
    .filter((p) => allowed.includes(p.id))
    .map((p) => '<button data-go="' + p.id + '" class="' + (p.id === S.page ? 'on' : '') + '">'
      + p.label + '</button>').join('');

  el('role').value = S.role;

  const painters = {
    dashboard: paintDashboard,
    students: paintStudents,
    fees: paintFees,

    store: paintStore,
    attendance: paintAttendance,
    staffatt: paintStaffAttendance,
    teachers: paintTeachers,

el('nav').addEventListener('click', (e) => {

});

// Delegated once: any [data-student] button in any list opens that profile.

/* --------------------------- dashboard --------------------------- */
function paintDashboard() {
  const term = S.config.currentTerm;
  const { bill, paid, owing } = feeSummary(term);
  const students = activeStudents();

  const debtors = students
    .map((s) => ({ s, due: billed(s, term) - paidBy(s.id, term) }))
    .filter((r) => r.due > 0)
    .sort((a, b) => b.due - a.due)
    .slice(0, 8);

  const collectionRate = bill > 0 ? Math.round((paid / bill) * 100) : 0;

  const recent = S.payments
    .slice()
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))
    .slice(0, 6);

  el('view').innerHTML =
    '<div class="head"><div><h1>Dashboard</h1>' +
    '<p>' + esc(S.config.year) + ' · ' + esc(term) + '</p></div></div>' +

    '<div class="stats">' +
      stat('Students on roll', students.length, S.classes.length + ' classes') +
      stat('Billed this term', money(bill), S.feeItems.filter(f => f.term === term).length + ' fee items') +
      stat('Collected', money(paid), collectionRate + '% of billing') +
      stat('Outstanding', money(owing), debtors.length + ' students owing') +
    '</div>' +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px">' +

      '<div class="card"><h2>Largest outstanding balances</h2>' +
      (debtors.length
        ? '<div class="scroll"><table><thead><tr><th>Student</th><th>Class</th><th class="num">Owing</th></tr></thead><tbody>' +
          debtors.map((r) =>
            '<tr><td>' + esc(r.s.name) + '</td><td>' + esc(className(r.s.classId)) +
            '</td><td class="num">' + money(r.due) + '</td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="hint">Nothing outstanding for ' + esc(term) + '.</p>') +
      '</div>' +

      '<div class="card"><h2>Recent payments</h2>' +
      (recent.length
        ? '<div class="scroll"><table><thead><tr><th>Receipt</th><th>Student</th><th class="num">Amount</th></tr></thead><tbody>' +
          recent.map((p) => {
            const s = S.students.find((x) => x.id === p.studentId);
            return '<tr><td class="receipt">' + esc(p.receipt) + '</td><td>' +
              esc(s ? s.name : 'Removed student') + '</td><td class="num">' + money(p.amount) + '</td></tr>';
          }).join('') +
          '</tbody></table></div>'
        : '<p class="hint">No payments recorded yet.</p>') +
      '</div>' +

      storeSupplyCard() +

      staffAttendanceCard() +

      '<div class="card"><h2>Class roll</h2>' +
      (S.classes.length
        ? '<div class="scroll"><table><thead><tr><th>Class</th><th class="num">Students</th><th class="num">Owing</th></tr></thead><tbody>' +
          S.classes.map((c) => {
            const inClass = studentsIn(c.id);
            const due = inClass.reduce((sum, s) =>
              sum + Math.max(0, billed(s, term) - paidBy(s.id, term)), 0);
            return '<tr><td>' + esc(c.name) + '</td><td class="num">' + inClass.length +
              '</td><td class="num">' + money(due) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="hint">No classes set up yet.</p>') +
      '</div>' +

    '</div>';
}

/* Staff attendance on the dashboard: the Proprietress and the principal
   both see today's register. Nobody else does — it is a staffing matter,
   not general information. */
function staffAttendanceCard() {
  if (!['admin', 'principal'].includes(S.role)) return '';
  if (!S.teachers.length) return '';

  if (!S.staffToday || S.staffToday.date !== today()) {
    loadStaffToday();
    return '<div class="card"><h2>Staff attendance today</h2>' +
      '<p class="hint">Reading the register…</p></div>';
  }

  const marks = S.staffToday.marks;
  const roll = S.teachers;
  const counts = { P: 0, A: 0, L: 0, V: 0 };
  roll.forEach((t) => { if (counts[marks[t.id]] !== undefined) counts[marks[t.id]]++; });
  const marked = counts.P + counts.A + counts.L + counts.V;

  const away = roll
    .filter((t) => marks[t.id] && marks[t.id] !== 'P')
    .sort((a, b) => String(a.name).localeCompare(String(b.name)));

  return '<div class="card"><h2>Staff attendance today</h2>' +
    (marked === 0
      ? '<p class="hint">Not taken yet for ' + esc(today()) + '.</p>'
      : '<p class="hint">' + counts.P + ' of ' + roll.length + ' present · ' +
        marked + ' marked</p>' +
        (away.length
          ? '<div class="scroll"><table><thead><tr><th>Staff</th><th>Position</th><th>Status</th></tr></thead><tbody>' +
            away.map((t) =>
              '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.role || '—') + '</td>' +
              '<td><span class="tag">' + esc(STAFF_CODE_LABEL[marks[t.id]]) + '</span></td></tr>').join('') +
            '</tbody></table></div>'
          : '<p class="hint">Everyone marked is present.</p>')) +
    '<button class="btn ghost" style="margin-top:12px" ' +
    'onclick="S.page=\'staffatt\';render()">Open the register</button>' +
    '</div>';
}

function stat(k, v, n) {
  return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) +
    '</div><div class="n">' + esc(n) + '</div></div>';
}

/* --------------------------- students --------------------------- */
function paintStudents() {

  const q = S.studentQuery.toLowerCase();
  const rows = S.students
    .filter((s) => S.studentClass === 'all' || s.classId === S.studentClass)
    .filter((s) => !q || s.name.toLowerCase().includes(q) || String(s.adm).toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name));

  const term = S.config.currentTerm;
  const writable = canWrite('students');

  el('view').innerHTML =
    '<div class="head"><div><h1>Students</h1>' +
    '<p>' + activeStudents().length + ' on roll · ' + S.students.length + ' records in total</p></div>' +
    (writable ? '<button class="btn" id="add-student">Admit a student</button>' : '') +
    '</div>' +

    '<div class="bar">' +
      '<input type="text" id="q" placeholder="Search name or student ID" value="' + esc(S.studentQuery) + '">' +
      '<select id="fc"><option value="all">All classes</option>' +
      S.classes.map((c) => '<option value="' + c.id + '"' +
        (S.studentClass === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
      '</select>' +
    '</div>' +

    (rows.length
      ? '<div class="card" style="padding:0"><div class="scroll"><table><thead><tr>' +
        '<th>Student ID</th><th>Name</th><th>Class</th><th>Type</th><th>Status</th>' +
        '<th class="num">Balance</th>' + (writable ? '<th></th>' : '') +
        '</tr></thead><tbody>' +

          const due = billed(s, term) - paidBy(s.id, term);
          return '<tr>' +
            '<td class="receipt">' + esc(s.adm) + '</td>' +
            '<td><button class="btn ghost small" data-student="' + s.id + '">' +
              esc(s.name) + '</button></td>' +
            '<td>' + esc(className(s.classId)) + '</td>' +

            '<td class="num">' + (due > 0
              ? '<span class="tag bad">' + money(due) + '</span>'
              : '<span class="tag ok">settled</span>') + '</td>' +
            (writable ? '<td class="num"><button class="btn ghost small" data-edit="' + s.id + '">Edit</button></td>' : '') +
            '</tr>';
        }).join('') +
        '</tbody></table></div></div>'
      : '<div class="empty"><p>' + (S.students.length

          : 'No students admitted yet.') + '</p>' +
        (writable && !S.students.length ? '<button class="btn" id="add-student-2">Admit the first student</button>' : '') +
        '</div>');

  });

        status: el('m-status').value,
        isNew: el('m-new').value === 'new',
        admitted: s.admitted || today(),
      };

      if (!body.name) return toast('A name is required.', true);
      if (!body.adm) return toast('A student ID is required.', true);

      const clash = S.students.find((x) => x.adm === body.adm && x.id !== (s.id || ''));
      if (clash) return toast('That student ID belongs to ' + clash.name + '.', true);

      const id = s.id || uid();
      if (!(await save('students/' + id, body))) return;

      const record = Object.assign({ id }, body);
      const at = S.students.findIndex((x) => x.id === id);
      if (at >= 0) S.students[at] = record; else S.students.push(record);

      closeModal();
      render();
      toast(isNew ? body.name + ' admitted as ' + body.adm : 'Changes saved.');
    })
  );
}

/* --------------------------- fees --------------------------- */

      stat('Collected', money(paid), S.payments.filter(p => p.term === term).length + ' receipts') +

    (S.payments.length ? '<div class="card" style="margin-top:18px"><h2>Payment history</h2><div class="scroll">' +
      '<table><thead><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Method</th><th>Term</th><th class="num">Amount</th></tr></thead><tbody>' +
      S.payments.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 25)
        .map((p) => {

  const listing = () => S.feeItems.filter((f) => f.term === term).length
    ? '<div class="scroll"><table><thead><tr><th>Item</th><th>Class</th><th class="num">Amount</th><th></th></tr></thead><tbody>' +
      S.feeItems.filter((f) => f.term === term).map((f) =>
        '<tr><td>' + esc(f.name) +
          (f.newOnly ? ' <span class="hint">(new only)</span>' : '') + '</td>' +

        '<td class="num">' + money(f.amount) + '</td>' +

        '</div>' +

          '<option value="new">New / re-registering students only</option>' +
        '</select></label>' +
        '<button class="btn small" id="fi-add">Add fee item</button>' +
        '<p class="hint">Amounts apply per student, per term. Changing an amount does not alter payments already recorded.</p>' +
      '</div>' +

        el('fi-add').addEventListener('click', async () => {

          if (!name) return toast('Give the fee item a name.', true);
          if (!(amount > 0)) return toast('Enter an amount above zero.', true);

          const items = S.feeItems.concat([{
            id: uid(), name, amount, term,

            S.feeItems = items;

function paymentForm(studentId) {
  if (!guard('fees')) return;
  const term = S.config.currentTerm;
  const roll = activeStudents().sort((a, b) => a.name.localeCompare(b.name));
  if (!roll.length) return toast('Admit a student first.', true);

  openModal(
    '<h3>Record a payment</h3>' +
    '<label class="f"><span>Student</span><select id="p-student">' +
      roll.map((s) => '<option value="' + s.id + '"' + (s.id === studentId ? ' selected' : '') + '>' +
        esc(s.name) + ' — ' + esc(s.adm) + '</option>').join('') +
    '</select></label>' +
    '<p class="hint" id="p-owing"></p>' +
    '<div class="row2">' +
      '<label class="f"><span>Amount</span><input type="number" id="p-amount" min="0" step="1"></label>' +
      '<label class="f"><span>Date</span><input type="date" id="p-date" value="' + today() + '"></label>' +
    '</div>' +
    '<div class="row2">' +
      '<label class="f"><span>Method</span><select id="p-method">' +
        ['Cash', 'Bank transfer', 'Mobile money', 'Cheque'].map((m) => '<option>' + m + '</option>').join('') +
      '</select></label>' +
      '<label class="f"><span>Term</span><select id="p-term">' +
        S.config.terms.map((t) => '<option' + (t === term ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<label class="f"><span>Reference (optional)</span><input type="text" id="p-ref" placeholder="Bank slip or transaction id"></label>' +
    '<div class="foot">' +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn green" id="p-save">Record and issue receipt</button>' +
    '</div>',
    () => {
      const showOwing = () => {
        const s = S.students.find((x) => x.id === el('p-student').value);
        const t = el('p-term').value;
        const due = billed(s, t) - paidBy(s.id, t);
        el('p-owing').textContent = due > 0
          ? 'Outstanding for ' + t + ': ' + money(due)
          : 'Nothing outstanding for ' + t + '.';
      };
      el('p-student').addEventListener('change', showOwing);
      el('p-term').addEventListener('change', showOwing);
      showOwing();

      el('p-save').addEventListener('click', async () => {
        const amount = Number(el('p-amount').value);
        if (!(amount > 0)) return toast('Enter an amount above zero.', true);

        const id = uid();
        const body = {
          studentId: el('p-student').value,
          amount,
          date: el('p-date').value || today(),
          method: el('p-method').value,
          term: el('p-term').value,
          reference: el('p-ref').value.trim(),
          receipt: nextReceiptNumber(),
          // Stamped now, so it still means the right thing after promotion.
          year: S.config.year,
          recordedAt: new Date().toISOString(),
        };

        if (!(await save('payments/' + id, body))) return;
        S.payments.push(Object.assign({ id }, body));

        const s = S.students.find((x) => x.id === body.studentId);
        closeModal();
        render();
        showReceipt(body, s);
      });
    }
  );
}

function showReceipt(payment, student) {
  const due = billed(student, payment.term) - paidBy(student.id, payment.term);

  openModal(
    '<h3>Receipt ' + esc(payment.receipt) + '</h3>' +
    '<table><tbody>' +
      '<tr><td class="hint">Student</td><td>' + esc(student.name) + '</td></tr>' +

/* --------------------------- grades --------------------------- */
function paintGrades() {
  if (!S.classes.length || !S.subjects.length) return needSetup('Grades');

  if (!S.gradeSel.classId) S.gradeSel.classId = S.classes[0].id;
  if (!S.gradeSel.subjectId) S.gradeSel.subjectId = S.subjects[0].id;
  if (!S.gradeSel.term) S.gradeSel.term = S.config.currentTerm;

  const roll = studentsIn(S.gradeSel.classId);
  const marks = (S.gradeDoc && S.gradeDoc.key === gradeKey()) ? S.gradeDoc.marks : null;
  const writable = canWrite('grades');

  const computed = roll.map((s) => {
    const m = (marks && marks[s.id]) || {};
    const ca = Number(m.ca ?? NaN), mid = Number(m.mid ?? NaN), fin = Number(m.final ?? NaN);
    const any = [ca, mid, fin].some((v) => !isNaN(v));
    const total = any
      ? ((isNaN(ca) ? 0 : ca) * WEIGHTS.ca + (isNaN(mid) ? 0 : mid) * WEIGHTS.mid +
         (isNaN(fin) ? 0 : fin) * WEIGHTS.final) / 100
      : null;
    return { s, ca, mid, fin, total };
  });

  const ranked = computed.filter((r) => r.total !== null)
    .slice().sort((a, b) => b.total - a.total);
  const positionOf = (id) => {
    const at = ranked.findIndex((r) => r.s.id === id);
    return at < 0 ? '—' : String(at + 1);
  };

  el('view').innerHTML =
    '<div class="head"><div><h1>Grades</h1>' +
    '<p>Continuous assessment ' + WEIGHTS.ca + '% · mid-term ' + WEIGHTS.mid +
    '% · final ' + WEIGHTS.final + '%</p></div></div>' +

    '<div class="bar">' +
      '<select id="g-class">' + S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.id === S.gradeSel.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select>' +
      '<select id="g-subject">' + S.subjects.map((s) => '<option value="' + s.id + '"' +
        (s.id === S.gradeSel.subjectId ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>' +
      '<select id="g-term">' + S.config.terms.map((t) => '<option' +
        (t === S.gradeSel.term ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select>' +
      (marks === null ? '<span class="hint">Loading marks…</span>' : '') +
    '</div>' +

    (roll.length === 0
      ? '<div class="empty"><p>No students in ' + esc(className(S.gradeSel.classId)) + '.</p></div>'
      : '<div class="card" style="padding:0"><div class="scroll"><table><thead><tr>' +
        '<th>Student</th><th class="num">CA /100</th><th class="num">Mid /100</th>' +
        '<th class="num">Final /100</th><th class="num">Total</th><th>Grade</th><th class="num">Position</th>' +
        '</tr></thead><tbody>' +
        computed.map((r) => {
          const band = r.total === null ? null : bandFor(r.total);
          return '<tr><td>' + esc(r.s.name) + '<br><span class="hint">' + esc(r.s.adm) + '</span></td>' +
            ['ca', 'mid', 'fin'].map((f) => {
              const value = r[f];
              return '<td class="num">' + (writable
                ? '<input class="mark" type="number" min="0" max="100" data-mark="' +
                  r.s.id + '|' + (f === 'fin' ? 'final' : f) + '" value="' +
                  (isNaN(value) ? '' : value) + '">'
                : (isNaN(value) ? '—' : value)) + '</td>';
            }).join('') +
            '<td class="num">' + (r.total === null ? '—' : r.total.toFixed(1)) + '</td>' +
            '<td>' + (band ? '<span class="tag ' + (r.total >= 50 ? 'ok' : 'bad') + '">' +
              band.letter + '</span> <span class="hint">' + band.note + '</span>' : '—') + '</td>' +
            '<td class="num">' + positionOf(r.s.id) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></div>' +
        (writable ? '<p class="hint">Marks save automatically when you leave a box. ' +
          'Teachers in the Laravel system can only open classes they are assigned to.</p>' : ''));

  el('g-class').addEventListener('change', (e) => {
    S.gradeSel.classId = e.target.value; S.gradeDoc = null; render(); loadGrades();
  });
  el('g-subject').addEventListener('change', (e) => {
    S.gradeSel.subjectId = e.target.value; S.gradeDoc = null; render(); loadGrades();
  });
  el('g-term').addEventListener('change', (e) => {
    S.gradeSel.term = e.target.value; S.gradeDoc = null; render(); loadGrades();
  });

  el('view').querySelectorAll('[data-mark]').forEach((box) => {
    box.addEventListener('change', async () => {
      const [studentId, field] = box.dataset.mark.split('|');
      let value = box.value === '' ? null : Number(box.value);

      if (value !== null && (isNaN(value) || value < 0 || value > 100)) {
        toast('Marks must be between 0 and 100.', true);
        box.value = '';
        return;
      }

      const marksNow = Object.assign({}, (S.gradeDoc && S.gradeDoc.marks) || {});
      const entry = Object.assign({}, marksNow[studentId] || {});
      if (value === null) delete entry[field]; else entry[field] = value;

      if (Object.keys(entry).length) marksNow[studentId] = entry;
      else delete marksNow[studentId];

      if (!(await save('scores/' + gradeKey(), { marks: marksNow, updated: new Date().toISOString() }))) return;
      S.analytics = null;   // reports and report cards must re-read
      S.gradeDoc = { key: gradeKey(), marks: marksNow };
      render();
    });
  });

  if (marks === null) loadGrades();
}

function gradeKey() {
  return S.gradeSel.classId + '_' + S.gradeSel.subjectId + '_' +
    S.gradeSel.term.replace(/\s+/g, '');
}

async function loadGrades() {
  const key = gradeKey();
  try {
    const snap = await db.doc('scores/' + key).get();
    S.gradeDoc = { key, marks: (snap.exists ? snap.data().marks : {}) || {} };
  } catch (error) {
    console.error(error);
    S.gradeDoc = { key, marks: {} };
    toast('Could not load marks.', true);
  }
  if (S.page === 'grades') render();
}

/* --------------------------- attendance --------------------------- */
function paintAttendance() {
  if (!S.classes.length) return needSetup('Attendance');

  if (!S.attSel.classId) S.attSel.classId = S.classes[0].id;
  if (!S.attSel.date) S.attSel.date = today();

  const roll = studentsIn(S.attSel.classId);
  const marks = (S.attDoc && S.attDoc.key === attKey()) ? S.attDoc.states : null;
  const writable = canWrite('attendance');

  const counts = { P: 0, A: 0, L: 0, E: 0 };
  if (marks) roll.forEach((s) => { if (marks[s.id]) counts[marks[s.id]]++; });
  const marked = counts.P + counts.A + counts.L + counts.E;
  const rate = marked ? Math.round(((counts.P + counts.L) / marked) * 100) : 0;

  el('view').innerHTML =
    '<div class="head"><div><h1>Attendance</h1>' +
    '<p>' + esc(className(S.attSel.classId)) + ' · ' + esc(S.attSel.date) + '</p></div>' +
    (writable && roll.length ? '<button class="btn ghost" id="a-all">Mark all present</button>' : '') +
    '</div>' +

    '<div class="bar">' +
      '<select id="a-class">' + S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.id === S.attSel.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select>' +
      '<input type="date" id="a-date" style="width:auto" value="' + esc(S.attSel.date) + '">' +
      (marks === null ? '<span class="hint">Loading register…</span>' : '') +
    '</div>' +

    (roll.length === 0
      ? '<div class="empty"><p>No students in this class.</p></div>'
      : '<div class="stats">' +
          stat('Present', counts.P, 'of ' + roll.length + ' on roll') +
          stat('Absent', counts.A, counts.E + ' excused') +
          stat('Late', counts.L, '') +
          stat('Attendance', rate + '%', marked + ' marked') +
        '</div>' +
        '<div class="card" style="margin-top:18px;padding:0"><div class="scroll"><table><thead><tr>' +
        '<th>Student</th><th>Present / Absent / Late / Excused</th>' +
        '</tr></thead><tbody>' +
        roll.map((s) => {
          const state = marks ? marks[s.id] : null;
          return '<tr><td>' + esc(s.name) + '<br><span class="hint">' + esc(s.adm) + '</span></td>' +
            '<td><div class="att">' +
            ['P', 'A', 'L', 'E'].map((code) =>
              '<button data-s="' + code + '" data-set="' + s.id + '|' + code + '" class="' +
              (state === code ? 'on' : '') + '"' + (writable ? '' : ' disabled') + '>' + code + '</button>').join('') +
            '</div></td></tr>';
        }).join('') +
        '</tbody></table></div></div>');

  el('a-class').addEventListener('change', (e) => {
    S.attSel.classId = e.target.value; S.attDoc = null; render(); loadAttendance();
  });
  el('a-date').addEventListener('change', (e) => {
    S.attSel.date = e.target.value || today(); S.attDoc = null; render(); loadAttendance();
  });

  const all = el('a-all');
  if (all) all.addEventListener('click', async () => {
    if (!guard('attendance')) return;
    const states = {};
    roll.forEach((s) => { states[s.id] = 'P'; });
    if (!(await save('attendance/' + attKey(), { states, updated: new Date().toISOString() }))) return;
    S.analytics = null;
    S.attDoc = { key: attKey(), states };
    render();
    toast('All ' + roll.length + ' marked present.');
  });

  el('view').querySelectorAll('[data-set]').forEach((b) => {
    b.addEventListener('click', async () => {
      if (!guard('attendance')) return;
      const [studentId, code] = b.dataset.set.split('|');
      const states = Object.assign({}, (S.attDoc && S.attDoc.states) || {});

      if (states[studentId] === code) delete states[studentId];
      else states[studentId] = code;

      if (!(await save('attendance/' + attKey(), { states, updated: new Date().toISOString() }))) return;
      S.analytics = null;
      S.attDoc = { key: attKey(), states };
      render();
    });
  });

  if (marks === null) loadAttendance();
}

function attKey() {
  return S.attSel.classId + '_' + S.attSel.date;
}

async function loadAttendance() {
  const key = attKey();
  try {
    const snap = await db.doc('attendance/' + key).get();
    S.attDoc = { key, states: (snap.exists ? snap.data().states : {}) || {} };
  } catch (error) {
    console.error(error);
    S.attDoc = { key, states: {} };
    toast('Could not load the register.', true);
  }
  if (S.page === 'attendance') render();
}

/* --------------------------- moving students ---------------------------
   Promotion, repeating, graduating and leaving.

   A class change is an EVENT, not an edit. Every move is written to a
   dated document in `promotions/`, saying who moved whom, from where to
   where, and why. A school year that cannot be reconstructed afterwards is
   a school year nobody can answer a parent's question about.

   The class select on the student form is read-only for the same reason:
   quietly retyping a class leaves no trace, and the one operation most
   likely to be done wrong is the one that most needs a trail.
   --------------------------------------------------------------------- */

const MOVE_REASONS = [
  { id: 'PROMOTION', label: 'Promoted to the next level' },
  { id: 'REPEAT',    label: 'Repeating this level' },
  { id: 'TRANSFER',  label: 'Moved within the year (correction or request)' },
  { id: 'GRADUATE',  label: 'Completed the top level' },
  { id: 'WITHDRAW',  label: 'Left the school' },
];
const MOVE_LABEL = Object.fromEntries(MOVE_REASONS.map((r) => [r.id, r.label]));

/** The level above this one, in the order the classes are set up. */
function nextClassOf(classId) {
  const at = S.classes.findIndex((c) => c.id === classId);
  return at >= 0 && at < S.classes.length - 1 ? S.classes[at + 1] : null;
}

function isTopClass(classId) {
  return S.classes.length > 0 && S.classes[S.classes.length - 1].id === classId;
}

/** What a student owes across every term of the current year. */
function owedAcrossYear(student) {
  return S.config.terms.reduce((sum, t) =>
    sum + Math.max(0, billed(student, t) - paidBy(student.id, t)), 0);
}

async function loadPromotions() {
  try {
    const snap = await db.collection('promotions').get();
    S.promotions = snap.docs
      .map((d) => ({ date: d.id, rows: d.data().rows || [] }))
      .sort((a, b) => b.date.localeCompare(a.date));
  } catch (error) {
    console.error(error);
    S.promotions = [];
    toast('Could not load the class history.', true);
  }
  if (S.page === 'promote') render();
}

/** Every recorded move for one student, newest first. */
function classHistory(studentId) {
  if (!S.promotions) return [];
  const out = [];
  S.promotions.forEach((d) => d.rows.forEach((r) => {
    if (r.studentId === studentId) out.push(Object.assign({ date: d.date }, r));
  }));
  return out.sort((a, b) => String(b.at || b.date).localeCompare(String(a.at || a.date)));
}

/** Append a batch of moves to today's document. */
async function recordMoves(rows) {
  const date = today();
  const existing = (S.promotions || []).find((d) => d.date === date);
  const all = (existing ? existing.rows : []).concat(rows);

  if (!(await save('promotions/' + date, { rows: all, updated: new Date().toISOString() }))) {
    return false;
  }

  if (existing) existing.rows = all;
  else (S.promotions = S.promotions || []).unshift({ date, rows: all });

  return true;
}

/* ------------------------------ the screen ------------------------------ */

function paintPromote() {
  if (!S.classes.length) return needSetup('Promotion');
  if (!S.promotions) loadPromotions();

  if (!S.promoteSel.classId || !S.classes.some((c) => c.id === S.promoteSel.classId)) {
    // Open on a class that actually has pupils in it. Landing on an empty
    // level means the first thing the screen says is "nothing here", and
    // whoever opened it has to go hunting.
    const populated = S.classes.find((c) => studentsIn(c.id).length);
    S.promoteSel = {
      classId: (populated || S.classes[0]).id, toId: '', actions: {},
    };
  }

  const from = S.classes.find((c) => c.id === S.promoteSel.classId);
  const roll = studentsIn(from.id);
  const next = nextClassOf(from.id);
  const top = isTopClass(from.id);

  if (!S.promoteSel.toId) {
    S.promoteSel.toId = next ? next.id : from.id;
  }
  const to = S.classes.find((c) => c.id === S.promoteSel.toId) || from;

  // Default each student to the sensible action, once.
  roll.forEach((s) => {
    if (!S.promoteSel.actions[s.id]) {
      S.promoteSel.actions[s.id] = top ? 'GRADUATE' : 'PROMOTION';
    }
  });

  const tally = { PROMOTION: 0, REPEAT: 0, GRADUATE: 0, WITHDRAW: 0, NONE: 0 };
  roll.forEach((s) => { tally[S.promoteSel.actions[s.id] || 'NONE']++; });

  const owing = roll.filter((s) => owedAcrossYear(s) > 0);

  el('view').innerHTML =
    '<div class="head"><div><h1>Promotion</h1>' +
    '<p>Move a class up at the end of the year · ' + esc(S.config.year) + '</p></div></div>' +

    '<div class="bar">' +
      '<select id="pm-from">' + S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.id === from.id ? ' selected' : '') + '>' + esc(c.name) + ' — ' +
        studentsIn(c.id).length + ' on roll</option>').join('') + '</select>' +
      '<span class="hint" style="margin:0">moves to</span>' +
      '<select id="pm-to">' + S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.id === to.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
      '</select>' +
    '</div>' +

    (top
      ? '<p class="hint" style="margin-top:-8px;margin-bottom:16px">' +
        esc(from.name) + ' is the top level, so everyone here defaults to ' +
        'graduating. Change any who are staying on.</p>'
      : '') +

    '<div class="stats">' +
      stat('On roll', roll.length, esc(from.name)) +
      stat('Promoting', tally.PROMOTION, 'to ' + esc(to.name)) +
      stat('Repeating', tally.REPEAT, tally.GRADUATE + ' graduating') +
      stat('Owing fees', owing.length,
        owing.length ? 'check before moving' : 'nothing outstanding') +
    '</div>' +

    (roll.length === 0
      ? '<div class="empty" style="margin-top:18px"><p>No students in ' +
        esc(from.name) + '.</p></div>'
      : '<div class="card" style="margin-top:18px;padding:0">' +
        '<div class="scroll"><table><thead><tr>' +
        '<th>Student</th><th class="num">Owing, this year</th>' +
        '<th>What happens</th></tr></thead><tbody>' +
        roll.map((s) => {
          const due = owedAcrossYear(s);
          const act = S.promoteSel.actions[s.id];

          return '<tr><td>' + esc(s.name) +
            '<br><span class="hint">' + esc(s.adm) + '</span></td>' +
            '<td class="num">' + (due > 0
              ? '<span class="tag bad">' + money(due) + '</span>'
              : '<span class="tag ok">settled</span>') + '</td>' +
            '<td><select data-act="' + s.id + '" style="min-width:230px">' +
              '<option value="PROMOTION"' + (act === 'PROMOTION' ? ' selected' : '') +
                '>Move to ' + esc(to.name) + '</option>' +
              '<option value="REPEAT"' + (act === 'REPEAT' ? ' selected' : '') +
                '>Repeat ' + esc(from.name) + '</option>' +
              '<option value="GRADUATE"' + (act === 'GRADUATE' ? ' selected' : '') +
                '>Graduate</option>' +
              '<option value="WITHDRAW"' + (act === 'WITHDRAW' ? ' selected' : '') +
                '>Left the school</option>' +
              '<option value="NONE"' + (act === 'NONE' ? ' selected' : '') +
                '>Leave unchanged</option>' +
            '</select></td></tr>';
        }).join('') +
        '</tbody></table></div></div>' +

        '<div class="card" style="margin-top:18px">' +
        '<h2>Before you apply this</h2>' +
        '<p class="hint" style="margin-top:0">Moving a student changes what ' +
        'they are billed from that moment on, because fees follow the class. ' +
        'Marks and registers do not move — they stay against the class and ' +
        'term they were entered for, which is what a report card has to show.</p>' +
        (owing.length
          ? '<p class="hint"><b>' + owing.length + ' student(s) still owe fees ' +
            'for ' + esc(S.config.year) + '.</b> The portal will not stop you — ' +
            'whether a debt blocks promotion is the school\'s decision, not the ' +
            'software\'s — but the balances stay against their name and follow ' +
            'them up.</p>'
          : '') +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +
          '<button class="btn" id="pm-apply">Apply to ' +
            (tally.PROMOTION + tally.REPEAT + tally.GRADUATE + tally.WITHDRAW) +
            ' student(s)</button>' +
          '<button class="btn ghost" id="pm-reset">Reset the choices</button>' +
        '</div></div>') +

    yearRollCard() +
    recentMovesCard();

  el('pm-from').addEventListener('change', (e) => {
    S.promoteSel = { classId: e.target.value, toId: '', actions: {} };
    render();
  });
  el('pm-to').addEventListener('change', (e) => {
    S.promoteSel.toId = e.target.value; render();

  el('view').querySelectorAll('[data-act]').forEach((sel) => {

  const roll1 = el('pm-rollyear');
  if (roll1) roll1.addEventListener('click', rollAcademicYear);
}

/** "2026/2027" -> "2027/2028". Falls back to leaving it alone. */
function nextAcademicYear(year) {
  const m = String(year).match(/^(\d{4})\s*\/\s*(\d{2,4})$/);
  if (!m) return year;
  const start = Number(m[1]) + 1;
  const end = m[2].length === 4 ? String(Number(m[2]) + 1) : String(start + 1).slice(2);
  return start + '/' + end;
}

async function applyPromotion(from, to, roll) {
  if (!guard('students')) return;

  const moves = roll
    .map((s) => ({ s, act: S.promoteSel.actions[s.id] }))
    .filter((m) => m.act && m.act !== 'NONE');

  if (!moves.length) return toast('Nothing selected to change.', true);

  const counts = moves.reduce((a, m) => {
    a[m.act] = (a[m.act] || 0) + 1; return a;
  }, {});

  const summary = Object.entries(counts)
    .map(([k, n]) => n + ' ' + MOVE_LABEL[k].toLowerCase()).join(', ');

  if (!confirm(
    'This will change ' + moves.length + ' student record(s) in ' + from.name +
    ':\n\n' + summary + '\n\nEvery change is recorded with today\'s date and ' +
    'can be read back under Recent moves. Continue?'
  )) return;

  const button = el('pm-apply');
  if (button) { button.disabled = true; button.textContent = 'Applying…'; }

  try {
    const rows = [];
    const students = S.students.slice();

    for (const { s, act } of moves) {
      const body = Object.assign({}, s);
      delete body.id;

      if (act === 'PROMOTION') {
        body.classId = to.id;
        // Moving up inside the school is not a new admission. Level 1,
        // Grade 1 and Grade 7 are still billed as new — that is decided by
        // the class they land in, not by this flag.
        body.isNew = false;
      } else if (act === 'REPEAT') {
        body.isNew = false;
      } else if (act === 'GRADUATE') {
        body.status = 'Graduated';
      } else if (act === 'WITHDRAW') {
        body.status = 'Withdrawn';
      }

      if (!(await save('students/' + s.id, body))) {
        throw new Error('save failed for ' + s.name);
      }

      const at = students.findIndex((x) => x.id === s.id);
      students[at] = Object.assign({ id: s.id }, body);

      rows.push({
        id: uid(),
        studentId: s.id,
        // Names are copied, not looked up: a class renamed next year must
        // not rewrite what last year's record says happened.
        name: s.name,
        fromClassId: from.id,
        fromName: from.name,
        toClassId: act === 'PROMOTION' ? to.id : from.id,
        toName: act === 'PROMOTION' ? to.name
          : act === 'GRADUATE' ? 'Graduated'
          : act === 'WITHDRAW' ? 'Left'
          : from.name,
        reason: act,
        year: S.config.year,
        by: PORTAL_ROLE_LABEL[S.role] || S.role,
        at: new Date().toISOString(),
      });
    }

    if (!(await recordMoves(rows))) return;

    S.students = students;
    S.promoteSel.actions = {};
    render();
    toast(moves.length + ' student record(s) updated.');
  } catch (error) {
    console.error(error);
    toast('Some records could not be saved. Check the list and try again.', true);
    await loadAll();
    render();
  } finally {
    if (button) { button.disabled = false; }
  }
}

/**
 * Close the year.
 *
 * Every payment taken so far is stamped with the outgoing year before the
 * clock moves on. Without that stamp a pupil who paid in full for Grade 4
 * would appear, the morning after promotion, to have paid their Grade 5
 * fees too — the kind of error nobody spots until a parent is told they owe
 * nothing and the accounts say otherwise.
 */
async function rollAcademicYear() {
  if (!guard('students')) return;

  const from = S.config.year;
  const to = nextAcademicYear(from);
  const unstamped = S.payments.filter((p) => p.year === undefined);

  if (!confirm(
    'Close ' + from + ' and open ' + to + '?\n\n' +
    unstamped.length + ' payment(s) will be stamped ' + from + ' and will stop ' +
    'counting towards this year\'s balances. They stay on each student\'s ' +
    'record.\n\nPromote your classes before doing this.'
  )) return;

  const button = el('pm-rollyear');
  if (button) { button.disabled = true; button.textContent = 'Closing…'; }

  try {
    for (const p of unstamped) {
      const body = Object.assign({}, p, { year: from });
      delete body.id;
      if (!(await save('payments/' + p.id, body))) {
        throw new Error('could not stamp payment ' + p.receipt);
      }
      p.year = from;
    }

    const config = Object.assign({}, S.config, {
      year: to,
      currentTerm: S.config.terms[0],
    });
    if (!(await save('config/school', config))) return;
    S.config = config;

    render();
    toast(to + ' is now the current year. ' + unstamped.length +
      ' payment(s) stamped ' + from + '.');
  } catch (error) {
    console.error(error);
    toast('The year was not closed. Nothing was changed by half.', true);
    await loadAll();
    render();
  } finally {
    if (button) { button.disabled = false; }
  }
}

/**
 * Move one student, on its own.
 *
 * Separate from the bulk screen because the reasons are different: this is
 * a correction, a mid-year transfer, or one pupil moving out of step. The
 * form says out loud what it will do to their bill, because a mid-year move
 * re-bills them at the new class's rate for terms they may already have
 * paid at the old one.
 */
function moveStudentForm(student) {
  if (!guard('students')) return;
  if (!S.classes.length) return toast('Set up your classes first.', true);

  const term = S.config.currentTerm;
  const nowBilled = billed(student, term);

  openModal(
    '<h3>Move ' + esc(student.name) + '</h3>' +
    '<p class="hint" style="margin-top:-8px">Currently in ' +
      esc(className(student.classId)) + '</p>' +

    '<label class="f"><span>Move to</span><select id="mv-class">' +
      S.classes.map((c) => '<option value="' + c.id + '"' +
        (c.id === (nextClassOf(student.classId) || {}).id ? ' selected' : '') + '>' +
        esc(c.name) + '</option>').join('') +
    '</select></label>' +

    '<label class="f"><span>Reason</span><select id="mv-reason">' +
      MOVE_REASONS.filter((r) => !['GRADUATE', 'WITHDRAW'].includes(r.id))
        .map((r) => '<option value="' + r.id + '">' + esc(r.label) + '</option>').join('') +
    '</select></label>' +

    '<div id="mv-effect"></div>' +

    '<p class="hint">Marks and attendance already recorded stay where they ' +
    'are, against the class and term they were entered for. Only what ' +
    'happens from here changes.</p>' +

    '<div class="foot">' +
      '<button class="btn ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn" id="mv-save">Move student</button>' +
    '</div>',
    () => {
      const showEffect = () => {
        const target = S.classes.find((c) => c.id === el('mv-class').value);
        if (!target) return;

        // What the same student would be billed once they are in the new
        // class, for the term that is running now.
        const after = S.feeItems
          .filter((f) => f.classId === target.id && f.term === term)
          .filter((f) => !f.newOnly || isNewStudent(
            Object.assign({}, student, { classId: target.id })))
          .reduce((sum, f) => sum + Number(f.amount || 0), 0);

        const diff = after - nowBilled;

        el('mv-effect').innerHTML =
          '<p class="hint" style="margin-top:0"><b>' + esc(term) + ' billing</b> ' +
          'goes from ' + money(nowBilled) + ' to ' + money(after) +
          (diff === 0 ? ' — no change.'
            : diff > 0 ? ' — <b>' + money(diff) + ' more</b> to pay this term.'
            : ' — <b>' + money(-diff) + ' less</b>, which may leave a credit.') +
          '</p>' +
          (diff !== 0
            ? '<p class="hint">At the end of the year this is normal: the new ' +
              'year is billed at the new level. Mid-year it is worth telling ' +
              'the accounts office, because payments already taken were ' +
              'against the old figure.</p>'
            : '');
      };

      el('mv-class').addEventListener('change', showEffect);
      showEffect();

      el('mv-save').addEventListener('click', async () => {
        const toId = el('mv-class').value;
        const reason = el('mv-reason').value;

        if (toId === student.classId && reason !== 'REPEAT') {
          return toast('That is the class they are already in.', true);
        }

        const from = S.classes.find((c) => c.id === student.classId);
        const to = S.classes.find((c) => c.id === toId);

        const body = Object.assign({}, student, { classId: toId, isNew: false });
        delete body.id;

        if (!(await save('students/' + student.id, body))) return;

        if (!S.promotions) await loadPromotions();

        await recordMoves([{
          id: uid(),
          studentId: student.id,
          name: student.name,
          fromClassId: student.classId,
          fromName: from ? from.name : '—',
          toClassId: toId,
          toName: to ? to.name : '—',
          reason,
          year: S.config.year,
          by: PORTAL_ROLE_LABEL[S.role] || S.role,
          at: new Date().toISOString(),
        }]);

        Object.assign(student, { classId: toId, isNew: false });

        closeModal();
        render();
        toast(student.name + ' moved to ' + (to ? to.name : 'the new class') + '.');
      });
    }
  );
}

/* --------------------------- the school store ---------------------------
   Book shop and uniform shop, run off an append-only ledger.

   Documents:
     config/stock        { items: [...] }              definitions, admin only
     receipts/{date}     { rows: [{itemId,qty,note}] } deliveries in, admin only
     issues/{date}       { rows: [{studentId,itemId,...}] } out, store keeper

   Three paths, three permissions. Nobody writes a quantity; everybody
   writes a movement.
   --------------------------------------------------------------------- */

function stockItem(id) {
  return S.stockItems.find((i) => i.id === id) || null;
}

/** What is actually on the shelf: opening count, plus every delivery, less every issue. */
function onHand(itemId) {
  const item = stockItem(itemId);
  if (!item) return 0;

  let qty = Number(item.opening || 0);
  if (!S.stockLedger) return qty;

  S.stockLedger.receipts.forEach((d) => d.rows.forEach((r) => {
    if (r.itemId === itemId) qty += Number(r.qty || 0);
  }));
  S.stockLedger.issues.forEach((d) => d.rows.forEach((r) => {
    if (r.itemId === itemId) qty -= Number(r.qty || 0);
  }));

  return qty;
}

/** How many of one item a student has already been given, and when. */
function issuedToStudent(studentId, itemId) {
  const out = { qty: 0, last: null };
  if (!S.stockLedger) return out;

  S.stockLedger.issues.forEach((d) => d.rows.forEach((r) => {
    if (r.studentId === studentId && r.itemId === itemId) {
      out.qty += Number(r.qty || 0);
      if (!out.last || d.date > out.last) out.last = d.date;
    }
  }));

  return out;
}

/**
 * What this student's grade entitles them to.
 *
 * An item with no classes listed is general stock anyone may draw. An item
 * with classes listed may be issued to those classes only — a Grade 7
 * uniform is not a Grade 1 uniform, and the store keeper should not have to
 * remember which is which at the counter.
 */
function itemsForStudent(student) {
  if (!student) return [];
  return S.stockItems.filter((i) =>
    !i.classIds || !i.classIds.length || i.classIds.includes(student.classId));
}

function issuesOn(date) {
  const doc = S.stockLedger && S.stockLedger.issues.find((d) => d.date === date);
  return doc ? doc.rows : [];
}

function lowStock() {
  return S.stockItems
    .map((i) => ({ item: i, left: onHand(i.id) }))
    .filter((r) => r.left <= Number(r.item.reorder || 0))
    .sort((a, b) => a.left - b.left);
}

async function loadStockLedger() {
  try {
    const [iss, rec] = await Promise.all([
      db.collection('issues').get(),
      db.collection('receipts').get(),
    ]);

    S.stockLedger = {
      issues: iss.docs.map((d) => ({ date: d.id, rows: d.data().rows || [] })),
      receipts: rec.docs.map((d) => ({ date: d.id, rows: d.data().rows || [] })),
    };
  } catch (error) {
    console.error(error);
    S.stockLedger = { issues: [], receipts: [] };
    toast('Could not load the store ledger.', true);
  }

  if (S.page === 'store' || S.page === 'dashboard') render();
}

/** Append one movement to the day's document, in memory and in the store. */
async function appendMovement(kind, row) {
  const date = today();
  const path = kind + '/' + date;

  const bucket = S.stockLedger[kind];
  const existing = bucket.find((d) => d.date === date);
  const rows = (existing ? existing.rows : []).concat([row]);

  if (!(await save(path, { rows, updated: new Date().toISOString() }))) return false;

  if (existing) existing.rows = rows;
  else bucket.push({ date, rows });

  return true;
}

function paintStore() {

  const canIssue = canWrite('issue');
  const loaded = !!S.stockLedger;

  if (!loaded) loadStockLedger();

  const todayRows = issuesOn(today());
  const servedToday = new Set(todayRows.map((r) => r.studentId)).size;
  const unitsToday = todayRows.reduce((a, r) => a + Number(r.qty || 0), 0);
  const low = loaded ? lowStock() : [];

  el('view').innerHTML =
    '<div class="head"><div><h1>Store</h1>' +
    '<p>Book shop and uniform shop · ' + esc(today()) + '</p></div>' +
    (canStock ? '<div style="display:flex;gap:8px">' +
      '<button class="btn ghost" id="st-receive">Receive a delivery</button>' +
      '<button class="btn" id="st-add">Add an item</button></div>' : '') +
    '</div>' +

    (canStock || canIssue ? '' :
      '<p class="hint" style="margin-bottom:14px">You can see the store but not ' +
      'change it.</p>') +

    '<div class="stats">' +
      stat('Items in the catalogue', S.stockItems.length,
        S.stockItems.filter((i) => i.category === 'Uniform').length + ' uniform, ' +
        S.stockItems.filter((i) => i.category === 'Books').length + ' book') +

      ? '<div class="empty" style="margin-top:18px"><p>The store is empty. ' +

function wireStore(canStock, canIssue) {
  const pick = el('st-student');
  if (pick) pick.addEventListener('change', (e) => {
    S.storeStudentId = e.target.value; render();
  });

  const add = el('st-add');
  if (add) add.addEventListener('click', () => stockItemForm(null));
